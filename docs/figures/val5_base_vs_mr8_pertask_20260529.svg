<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#cbd5e1"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="64" y="60" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#111827">Val5 per-task: Base 4B vs RL LoRA (MR8)</text>
  <text x="64" y="90" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">RL lifts advisory/gov but regresses council &amp; sentiment — net gain is small. MR8 = 3-run mean, base = 1-run.</text>

  <!-- legend -->
  <rect x="64" y="108" width="16" height="16" rx="3" fill="#94a3b8"/>
  <text x="86" y="121" font-family="Arial, sans-serif" font-size="14" fill="#374151">Base 4B (~49.7%)</text>
  <rect x="240" y="108" width="16" height="16" rx="3" fill="#2563eb"/>
  <text x="262" y="121" font-family="Arial, sans-serif" font-size="14" fill="#374151">MR8 LoRA (54.2%)</text>
  <rect x="404" y="108" width="16" height="16" rx="3" fill="url(#hatch)"/>
  <text x="426" y="121" font-family="Arial, sans-serif" font-size="14" fill="#374151">base judge not scored (excluded)</text>

  <!-- plot area: x 120..1180, y 160(top=100%)..560(0%) -->
  <!-- y grid + labels -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#6b7280">
    <line x1="120" y1="560" x2="1180" y2="560" stroke="#111827" stroke-width="1.6"/>
    <line x1="120" y1="160" x2="120" y2="560" stroke="#111827" stroke-width="1.6"/>
    <line x1="120" y1="480" x2="1180" y2="480" stroke="#e5e7eb"/><text x="112" y="485" text-anchor="end">20%</text>
    <line x1="120" y1="400" x2="1180" y2="400" stroke="#e5e7eb"/><text x="112" y="405" text-anchor="end">40%</text>
    <line x1="120" y1="320" x2="1180" y2="320" stroke="#e5e7eb"/><text x="112" y="325" text-anchor="end">60%</text>
    <line x1="120" y1="240" x2="1180" y2="240" stroke="#e5e7eb"/><text x="112" y="245" text-anchor="end">80%</text>
    <line x1="120" y1="160" x2="1180" y2="160" stroke="#e5e7eb"/><text x="112" y="165" text-anchor="end">100%</text>
    <text x="112" y="565" text-anchor="end">0%</text>
  </g>

  <!-- bars: 5 groups. group width 212, centers at 226,438,650,862,1074. bar w=66, base left, mr8 right -->
  <!-- scale: value*400 = px height (since 400px = 100%) -->
  <g font-family="Arial, sans-serif">
    <!-- advisory: base .41 mr8 .63 -->
    <rect x="160" y="396" width="66" height="164" fill="#94a3b8"/>
    <text x="193" y="388" font-size="14" font-weight="700" text-anchor="middle" fill="#6b7280">41</text>
    <rect x="234" y="308" width="66" height="252" fill="#2563eb"/>
    <text x="267" y="300" font-size="14" font-weight="700" text-anchor="middle" fill="#2563eb">63</text>
    <text x="230" y="582" font-size="15" text-anchor="middle" fill="#111827">advisory</text>
    <text x="230" y="600" font-size="13" font-weight="700" text-anchor="middle" fill="#166534">+22</text>

    <!-- council: base .24 mr8 .20 -->
    <rect x="372" y="464" width="66" height="96" fill="#94a3b8"/>
    <text x="405" y="456" font-size="14" font-weight="700" text-anchor="middle" fill="#6b7280">24</text>
    <rect x="446" y="480" width="66" height="80" fill="#2563eb"/>
    <text x="479" y="472" font-size="14" font-weight="700" text-anchor="middle" fill="#2563eb">20</text>
    <text x="442" y="582" font-size="15" text-anchor="middle" fill="#111827">council</text>
    <text x="442" y="600" font-size="13" font-weight="700" text-anchor="middle" fill="#b91c1c">-4</text>

    <!-- gov: base hatched (n/a) mr8 .59 -->
    <rect x="584" y="324" width="66" height="236" fill="url(#hatch)"/>
    <text x="617" y="316" font-size="13" font-weight="700" text-anchor="middle" fill="#94a3b8">n/a</text>
    <rect x="658" y="324" width="66" height="236" fill="#2563eb"/>
    <text x="691" y="316" font-size="14" font-weight="700" text-anchor="middle" fill="#2563eb">59</text>
    <text x="654" y="582" font-size="15" text-anchor="middle" fill="#111827">gov</text>
    <text x="654" y="600" font-size="12" text-anchor="middle" fill="#9ca3af">base judge missing</text>

    <!-- tech: base .71 mr8 .65 -->
    <rect x="796" y="276" width="66" height="284" fill="#94a3b8"/>
    <text x="829" y="268" font-size="14" font-weight="700" text-anchor="middle" fill="#6b7280">71</text>
    <rect x="870" y="300" width="66" height="260" fill="#2563eb"/>
    <text x="903" y="292" font-size="14" font-weight="700" text-anchor="middle" fill="#2563eb">65</text>
    <text x="866" y="582" font-size="15" text-anchor="middle" fill="#111827">tech</text>
    <text x="866" y="600" font-size="13" font-weight="700" text-anchor="middle" fill="#b91c1c">-6</text>

    <!-- sentiment: base .77 mr8 .64 -->
    <rect x="1008" y="252" width="66" height="308" fill="#94a3b8"/>
    <text x="1041" y="244" font-size="14" font-weight="700" text-anchor="middle" fill="#6b7280">77</text>
    <rect x="1082" y="304" width="66" height="256" fill="#2563eb"/>
    <text x="1115" y="296" font-size="14" font-weight="700" text-anchor="middle" fill="#2563eb">64</text>
    <text x="1078" y="582" font-size="15" text-anchor="middle" fill="#111827">sentiment</text>
    <text x="1078" y="600" font-size="13" font-weight="700" text-anchor="middle" fill="#b91c1c">-13</text>
  </g>

  <text x="64" y="660" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Source: val5 temp02. Base = run_20260529_qwen3_base_single_bench_test (1-run). MR8 = round_08_temp07 (3-run mean).</text>
  <text x="64" y="680" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">RL pattern: gains on advisory/gov are offset by regressions on the tasks base already handles well (tech, sentiment).</text>
</svg>
