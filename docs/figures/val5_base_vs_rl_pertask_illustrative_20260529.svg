<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="64" y="60" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#111827">Val5 per-task: Base 4B vs RL Policy</text>
  <text x="64" y="90" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">RL policy lifts the meeting-analysis suite across tasks. Illustrative example.</text>
  <rect x="1086" y="40" width="130" height="30" rx="15" fill="#fef3c7"/>
  <text x="1151" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#92400e">示例 / illustrative</text>

  <!-- legend -->
  <rect x="64" y="108" width="16" height="16" rx="3" fill="#94a3b8"/>
  <text x="86" y="121" font-family="Arial, sans-serif" font-size="14" fill="#374151">Base 4B (47.8%)</text>
  <rect x="240" y="108" width="16" height="16" rx="3" fill="#2563eb"/>
  <text x="262" y="121" font-family="Arial, sans-serif" font-size="14" fill="#374151">RL Policy (57.2%)</text>

  <!-- plot area: x 120..1180, y 160(top=100%)..560(0%); 400px = 100% -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#6b7280">
    <line x1="120" y1="560" x2="1180" y2="560" stroke="#111827" stroke-width="1.6"/>
    <line x1="120" y1="160" x2="120" y2="560" stroke="#111827" stroke-width="1.6"/>
    <line x1="120" y1="480" x2="1180" y2="480" stroke="#e5e7eb"/><text x="112" y="485" text-anchor="end">20%</text>
    <line x1="120" y1="400" x2="1180" y2="400" stroke="#e5e7eb"/><text x="112" y="405" text-anchor="end">40%</text>
    <line x1="120" y1="320" x2="1180" y2="320" stroke="#e5e7eb"/><text x="112" y="325" text-anchor="end">60%</text>
    <line x1="120" y1="240" x2="1180" y2="240" stroke="#e5e7eb"/><text x="112" y="245" text-anchor="end">80%</text>
    <line x1="120" y1="160" x2="1180" y2="160" stroke="#e5e7eb"/><text x="112" y="165" text-anchor="end">100%</text>
    <text x="112" y="565" text-anchor="end">0%</text>
  </g>

  <!-- 5 groups; base left (gray) / RL right (blue); bar w=66; value*400=height -->
  <g font-family="Arial, sans-serif">
    <!-- advisory: base .46 rl .58 -->
    <rect x="160" y="376" width="66" height="184" fill="#94a3b8"/>
    <text x="193" y="368" font-size="14" font-weight="700" text-anchor="middle" fill="#6b7280">46</text>
    <rect x="234" y="328" width="66" height="232" fill="#2563eb"/>
    <text x="267" y="320" font-size="14" font-weight="700" text-anchor="middle" fill="#2563eb">58</text>
    <text x="230" y="582" font-size="15" text-anchor="middle" fill="#111827">advisory</text>
    <text x="230" y="601" font-size="13" font-weight="700" text-anchor="middle" fill="#166534">+12</text>

    <!-- council: base .22 rl .34 -->
    <rect x="372" y="472" width="66" height="88" fill="#94a3b8"/>
    <text x="405" y="464" font-size="14" font-weight="700" text-anchor="middle" fill="#6b7280">22</text>
    <rect x="446" y="424" width="66" height="136" fill="#2563eb"/>
    <text x="479" y="416" font-size="14" font-weight="700" text-anchor="middle" fill="#2563eb">34</text>
    <text x="442" y="582" font-size="15" text-anchor="middle" fill="#111827">council</text>
    <text x="442" y="601" font-size="13" font-weight="700" text-anchor="middle" fill="#166534">+12</text>

    <!-- gov: base .48 rl .60 -->
    <rect x="584" y="368" width="66" height="192" fill="#94a3b8"/>
    <text x="617" y="360" font-size="14" font-weight="700" text-anchor="middle" fill="#6b7280">48</text>
    <rect x="658" y="320" width="66" height="240" fill="#2563eb"/>
    <text x="691" y="312" font-size="14" font-weight="700" text-anchor="middle" fill="#2563eb">60</text>
    <text x="654" y="582" font-size="15" text-anchor="middle" fill="#111827">gov</text>
    <text x="654" y="601" font-size="13" font-weight="700" text-anchor="middle" fill="#166534">+12</text>

    <!-- tech: base .66 rl .72 -->
    <rect x="796" y="296" width="66" height="264" fill="#94a3b8"/>
    <text x="829" y="288" font-size="14" font-weight="700" text-anchor="middle" fill="#6b7280">66</text>
    <rect x="870" y="272" width="66" height="288" fill="#2563eb"/>
    <text x="903" y="264" font-size="14" font-weight="700" text-anchor="middle" fill="#2563eb">72</text>
    <text x="866" y="582" font-size="15" text-anchor="middle" fill="#111827">tech</text>
    <text x="866" y="601" font-size="13" font-weight="700" text-anchor="middle" fill="#166534">+6</text>

    <!-- sentiment: base .67 rl .74 -->
    <rect x="1008" y="292" width="66" height="268" fill="#94a3b8"/>
    <text x="1041" y="284" font-size="14" font-weight="700" text-anchor="middle" fill="#6b7280">67</text>
    <rect x="1082" y="264" width="66" height="296" fill="#2563eb"/>
    <text x="1115" y="256" font-size="14" font-weight="700" text-anchor="middle" fill="#2563eb">74</text>
    <text x="1078" y="582" font-size="15" text-anchor="middle" fill="#111827">sentiment</text>
    <text x="1078" y="601" font-size="13" font-weight="700" text-anchor="middle" fill="#166534">+7</text>
  </g>

  <text x="64" y="668" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">Illustrative figure for narrative purposes — values are representative, not a measured benchmark run.</text>
</svg>
