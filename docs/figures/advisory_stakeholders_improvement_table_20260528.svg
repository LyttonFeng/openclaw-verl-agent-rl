  <text x="64" y="652" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Source: Val5 advisory_stakeholders. Base = run_20260529_qwen3_base_single_bench_test. RL = MR8 (round_08_temp07), 3-run mean.</text>
