<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640">
  <rect width="1120" height="640" fill="#ffffff"/>

  <text x="70" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Meeting Policy RL Validation Curve</text>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Normalized evaluation steps. Real Val5 scores at temperature 0.2; blue = 1-run, red diamonds = formal 3-run means.</text>

  <rect x="110" y="120" width="920" height="400" fill="#ffffff"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="110" y1="520" x2="1030" y2="520"/>
    <line x1="110" y1="431" x2="1030" y2="431"/>
    <line x1="110" y1="342" x2="1030" y2="342"/>
    <line x1="110" y1="253" x2="1030" y2="253"/>
    <line x1="110" y1="164" x2="1030" y2="164"/>
  </g>
  <line x1="110" y1="520" x2="1030" y2="520" stroke="#111827" stroke-width="1.5"/>
  <line x1="110" y1="120" x2="110" y2="520" stroke="#111827" stroke-width="1.5"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#374151" text-anchor="end">
    <text x="98" y="524">40%</text>
    <text x="98" y="435">44%</text>
    <text x="98" y="346">48%</text>
    <text x="98" y="257">52%</text>
    <text x="98" y="168">56%</text>
  </g>

  <rect x="110" y="302" width="920" height="218" fill="#f9fafb" opacity="0.75"/>
  <line x1="110" y1="347" x2="1030" y2="347" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 7"/>
  <text x="748" y="339" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">baseline reference 47.8%</text>

  <polyline fill="none" stroke="#2563eb" stroke-width="4" points="150,346.7 280,208.9 410,233.3 540,215.6 670,184.4 800,355.6 910,280.0 1010,157.8"/>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="2">
    <circle cx="150" cy="346.7" r="7"/>
    <circle cx="280" cy="208.9" r="7"/>
    <circle cx="410" cy="233.3" r="7"/>
    <circle cx="540" cy="215.6" r="7"/>
    <circle cx="670" cy="184.4" r="7"/>
    <circle cx="800" cy="355.6" r="7"/>
    <circle cx="910" cy="280.0" r="7"/>
    <circle cx="1010" cy="157.8" r="7"/>
  </g>

  <g fill="#dc2626" stroke="#ffffff" stroke-width="2">
    <path d="M670 194.4 L680 204.4 L670 214.4 L660 204.4 Z"/>
    <path d="M1010 350 L1020 360 L1010 370 L1000 360 Z"/>
  </g>
  <line x1="670" y1="184.4" x2="670" y2="204.4" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="1010" y1="157.8" x2="1010" y2="360.0" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#111827" text-anchor="middle">
    <text x="150" y="552">Baseline</text>
    <text x="280" y="552">Step 2</text>
    <text x="410" y="552">Step 4</text>
    <text x="540" y="552">Step 6</text>
    <text x="670" y="552">Step 8</text>
    <text x="800" y="552">Step 10</text>
    <text x="910" y="552">Step 12</text>
    <text x="1010" y="552">Step 14</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#111827" text-anchor="middle">
    <text x="150" y="330">47.8%</text>
    <text x="280" y="193">54.0%</text>
    <text x="410" y="217">52.9%</text>
    <text x="540" y="199">53.7%</text>
    <text x="670" y="168">55.1%</text>
    <text x="800" y="340">47.4%</text>
    <text x="910" y="264">50.8%</text>
    <text x="1010" y="141">56.3%</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">
    <text x="670" y="236">3-run 54.2%</text>
    <text x="980" y="390">3-run 47.2%</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#374151">
    <rect x="70" y="585" width="960" height="36" fill="#f9fafb" stroke="#e5e7eb"/>
    <line x1="95" y1="604" x2="135" y2="604" stroke="#2563eb" stroke-width="4"/>
    <circle cx="115" cy="604" r="6" fill="#2563eb"/>
    <text x="150" y="608">Val5 1-run score</text>
    <path d="M330 594 L340 604 L330 614 L320 604 Z" fill="#dc2626"/>
    <text x="355" y="608">Formal 3-run mean</text>
    <text x="570" y="608">Note: x-axis uses normalized evaluation steps for readability.</text>
  </g>
