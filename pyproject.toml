[project]
name = "openclaw-verl-agent-rl"
version = "0.1.0"
description = "Offline GRPO + Roadmap PRM training for meeting_analysis on Qwen3-4B, with OpenClaw multi-turn rollouts and PinchBench grading."
requires-python = "==3.12.*"
# veRL is installed editable from source (`pip install -e /path/to/verl`).
# It is intentionally NOT listed here — see docs/reproduction.md §1.
dependencies = [
  "pandas",
  "pyarrow",
  "pyyaml",
  "aiohttp",
  "packaging",
  "torch",
  "transformers==4.57.1",
  "accelerate",
  "peft",
  "vllm==0.10.2",
  "tensorboard",
]

[tool.ruff]
line-length = 100
