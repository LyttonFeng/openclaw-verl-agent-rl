task_id: task_meeting_advisory_attendees

goal: |
  Create a structured attendee list from a meeting transcript, categorizing each person by role, organization, attendance mode, and speaking role.

inputs:
  - meeting-transcript.md

output: attendees.md

# ROUND 3 (auto-promoted from R1 draft):
#   - DSv4-flash drafted task-specific milestones (kept).
#   - Added PRECONDITION to write milestone.
#   - Appended generic M_close_cleanly.
#   - Replaced pitfalls with the 5 canonical turn-level pitfalls
#     validated on pilot A (blog_post) + pilot B (council_budget).
#   - DSv4's task-specific pitfalls preserved as informational notes.

milestones:
  - id: M1_read_transcript
    desc: |
      The agent reads the meeting transcript file to extract attendee information.
    signals:
      - "tool call to read('meeting-transcript.md')"
      - "tool call to read('meeting-transcript.md') with result containing 'Members Present'"

  - id: M2_identify_committee_members
    desc: |
      The agent identifies the full list of committee members from the 'Members Present' sections, including their names and affiliations.
    signals:
      - "output text or tool call result listing names like 'Fontes', 'Borth', 'Calabrese', 'Dombrowsky', 'Donovan', 'Feldman', 'Furchtgott', 'Gibson', 'Hatfield', 'Kahn', 'McGinnis', 'McHenry', 'Obuchowski', 'Povelites', 'Reaser', 'Rush', 'Stancil', 'Tramont', 'Warren'"
      - "output text or tool call result containing 'Committee Members' or 'Members Present'"

  - id: M3_identify_non_member_officials_and_public
    desc: |
      The agent identifies non-member officials (Strickling, Nebbia, Power, Washington) and the public participant (Snider) from the 'Also Present' section and dialogue.
    signals:
      - "output text or tool call result containing 'Strickling', 'Nebbia', 'Power', 'Washington'"
      - "output text or tool call result containing 'Snider'"

  - id: M4_determine_attendance_mode
    desc: |
      The agent correctly identifies which attendees were remote/phone (Hatfield, Feldman, McGinnis, Stancil, Reaser, Donovan) using the asterisk notation and roll call.
    signals:
      - "output text or tool call result associating 'Hatfield', 'Feldman', 'McGinnis', 'Stancil', 'Reaser', 'Donovan' with 'phone', 'remote', or 'virtual'"
      - output text or tool call result referencing asterisk notation for remote attendees

  - id: M5_write_structured_attendees_file
    desc: |
      The agent writes the final `attendees.md` file with the correct sections, details, and summary count.
    signals:
      - "tool call to write('attendees.md', ...)"
      - "file 'attendees.md' exists in workspace"
      - "content of 'attendees.md' includes sections 'Committee Leadership', 'Committee Members (In-Person)', 'Committee Members (Remote)', 'Non-Member Officials', 'Public Participants'"
      - "content of 'attendees.md' includes a total count of attendees (e.g., '24 attendees')"
      - "PRECONDITION: a prior turn in this trajectory has performed a successful read of meeting-transcript.md (returned substantial content without is_error). If no such prior read exists, this milestone does NOT fire (the turn is P2_write_without_reading instead)."

  - id: M_close_cleanly
    desc: |
      The final turn of the trajectory, after the write milestone has fired,
      produces a brief confirmation or empty text and no further write that
      would replace the main output.
    signals:
      - this is the last turn of the trajectory
      - the write milestone has already fired in a prior turn
      - this turn has no tool call OR a non-write tool call
      - if there is any text, it is < 400 chars

pitfalls:
  - id: P1_no_output_written
    desc: |
      This is the LAST turn of the trajectory AND no `write` to the expected
      output file has occurred in any turn so far. The agent ran out of budget
      without producing the required output. (4B's dominant failure mode.)
    severity: high

  - id: P2_write_without_reading
    desc: |
      LITERAL CHECK ONLY. This turn issues a `write` tool_call to the expected
      output file AND no prior turn in this trajectory contains a `read`
      tool_call whose tool_result returned `is_error: false` with content
      length > 1000 chars on the input file. Do NOT infer hallucination from
      content style or formatting — only check whether a successful prior read
      tool_call exists in the trajectory history. If one does exist, this
      pitfall does NOT fire even if the written content is long and polished.
    severity: high

  - id: P3_post_write_rambling
    desc: |
      LITERAL CHECK ONLY. A prior turn already produced a `write` tool_call to
      the expected output file. THIS turn produces an assistant text block
      (`type: text`, OUTSIDE any tool_call) longer than 500 chars. Length
      check only — do NOT judge whether the trailing text "looks like" a
      paraphrase or restatement. If the trailing text is < 500 chars, this
      pitfall does NOT fire.
    severity: high

  - id: P4_excessive_thinking_no_action
    desc: |
      This turn's thinking is > 2500 chars AND no tool call is issued AND no
      substantive text (> 200 chars) is produced. Burning budget on thinking
      without any progress. (Note: thinking PAIRED with a meaningful tool call
      in the same turn is NOT a pitfall — Qwen3 requires thinking.)
    severity: high

  - id: P5_read_loop
    desc: |
      This turn issues a `read` of the input file with arguments identical to
      a previous read in the trajectory, AND no `write`, no extraction-thinking
      that names new content, and no extraction-text has occurred between the
      two reads. The agent is stuck re-reading the same chunk.
    severity: medium

notes: |
  The transcript uses an asterisk (*) to denote remote/phone attendees. The agent must cross-reference the 'Members Present' list, 'Also Present' section, and dialogue to capture all attendees.

  DSv4 also flagged these task-specific quality concerns
  (kept here for reference, not enforced by the judge):
    - P1_miss_remote_attendees: The agent fails to identify the remote/phone attendees (Hatfield, Feldman, McGinnis, Stancil, Reaser, Donovan) or incorrectly marks them as in-person.
    - P2_miss_public_participant: The agent overlooks Mr. Snider, the public participant who spoke during the public comment period.
    - P3_incomplete_member_list: The agent identifies fewer than 15 of the ~19 committee members by name.
    - P4_no_summary_count: The agent fails to include a summary count of total attendees at the end of the document.
    - P5_incorrect_organization_or_title: The agent assigns incorrect organizations or titles to attendees (e.g., misattributing NENA to someone else).
