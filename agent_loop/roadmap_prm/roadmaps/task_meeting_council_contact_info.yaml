task_id: task_meeting_council_contact_info

goal: |
  Extract all named individuals from a Tampa City Council meeting transcript and produce a categorized contacts report.

inputs:
  - transcript.md

output: contacts_report.md

# ROUND 3 (auto-promoted from R1 draft):
#   - DSv4-flash drafted task-specific milestones (kept).
#   - Added PRECONDITION to write milestone.
#   - Appended generic M_close_cleanly.
#   - Replaced pitfalls with the 5 canonical turn-level pitfalls
#     validated on pilot A (blog_post) + pilot B (council_budget).
#   - DSv4's task-specific pitfalls preserved as informational notes.

milestones:
  - id: M1_transcript_read
    desc: |
      The agent has read the full transcript file.
    signals:
      - "tool call to read('transcript.md') or read('transcript.md', ...)"
      - text mentions reading or having the full transcript

  - id: M2_council_members_extracted
    desc: |
      All 7 council members (Clendenin, Miranda, Maniscalco, Hurtak, Young, Viera, Carlson) are identified.
    signals:
      - "output contains \"Clendenin\", \"Miranda\", \"Maniscalco\", \"Hurtak\", \"Young\", \"Viera\", \"Carlson\""
      - "output contains section heading \"Council Members\""

  - id: M3_city_staff_extracted
    desc: |
      Key city staff (Shelby, Perry, Baird, Johns, Brody, DeManche, Kopesky) are identified with roles.
    signals:
      - "output contains \"Shelby\" with \"Attorney\" or \"Council Attorney\""
      - "output contains \"Perry\", \"Baird\", \"Johns\", \"Brody\", \"DeManche\", \"Kopesky\""
      - "output contains section heading \"City Staff\""

  - id: M4_presenters_and_experts_extracted
    desc: |
      Presenters (Hamilton/Raftelis, Guyette/Colliers, Chief Bercaw, TPD promotions) are identified.
    signals:
      - "output contains \"Hamilton\" with \"Raftelis\""
      - "output contains \"Bercaw\" with \"Chief\" or \"Police Chief\""
      - "output contains \"DeFelice\", \"Messmer\", \"Purcell\", \"McCormick\""
      - "output contains section heading \"Presenters and Experts\""

  - id: M5_public_speakers_and_others_extracted
    desc: |
      At least 12 public speakers and other notable individuals (McNeil, Milo) are identified.
    signals:
      - "{'output contains at least 12 of': 'Jeraldine, Iman, Hych, Cannella, Cornell, Citro, Morrow, Bennett, Poole, Michelini, Adair, Lockett, Bullock, Poynor, Randolph, Rodriguez'}"
      - "output contains \"McNeil\" with \"Officer of the Month\" or \"award\""
      - "output contains \"Milo\" with \"Related Urban\""
      - "output contains section heading \"Community Members / Public Speakers\" or \"Other People Mentioned\""

  - id: M6_report_written
    desc: |
      The final contacts_report.md file is created with all sections.
    signals:
      - "tool call to write('contacts_report.md', ...)"
      - file contacts_report.md exists in workspace
      - "PRECONDITION: a prior turn in this trajectory has performed a successful read of transcript.md (returned substantial content without is_error). If no such prior read exists, this milestone does NOT fire (the turn is P2_write_without_reading instead)."

  - id: M_close_cleanly
    desc: |
      The final turn of the trajectory, after the write milestone has fired,
      produces a brief confirmation or empty text and no further write that
      would replace the main output.
    signals:
      - this is the last turn of the trajectory
      - the write milestone has already fired in a prior turn
      - this turn has no tool call OR a non-write tool call
      - if there is any text, it is < 400 chars

pitfalls:
  - id: P1_no_output_written
    desc: |
      This is the LAST turn of the trajectory AND no `write` to the expected
      output file has occurred in any turn so far. The agent ran out of budget
      without producing the required output. (4B's dominant failure mode.)
    severity: high

  - id: P2_write_without_reading
    desc: |
      LITERAL CHECK ONLY. This turn issues a `write` tool_call to the expected
      output file AND no prior turn in this trajectory contains a `read`
      tool_call whose tool_result returned `is_error: false` with content
      length > 1000 chars on the input file. Do NOT infer hallucination from
      content style or formatting — only check whether a successful prior read
      tool_call exists in the trajectory history. If one does exist, this
      pitfall does NOT fire even if the written content is long and polished.
    severity: high

  - id: P3_post_write_rambling
    desc: |
      LITERAL CHECK ONLY. A prior turn already produced a `write` tool_call to
      the expected output file. THIS turn produces an assistant text block
      (`type: text`, OUTSIDE any tool_call) longer than 500 chars. Length
      check only — do NOT judge whether the trailing text "looks like" a
      paraphrase or restatement. If the trailing text is < 500 chars, this
      pitfall does NOT fire.
    severity: high

  - id: P4_excessive_thinking_no_action
    desc: |
      This turn's thinking is > 2500 chars AND no tool call is issued AND no
      substantive text (> 200 chars) is produced. Burning budget on thinking
      without any progress. (Note: thinking PAIRED with a meaningful tool call
      in the same turn is NOT a pitfall — Qwen3 requires thinking.)
    severity: high

  - id: P5_read_loop
    desc: |
      This turn issues a `read` of the input file with arguments identical to
      a previous read in the trajectory, AND no `write`, no extraction-thinking
      that names new content, and no extraction-text has occurred between the
      two reads. The agent is stuck re-reading the same chunk.
    severity: medium

notes: |
  The transcript is long (~120k chars) and requires multiple read calls. The agent must read the entire file to capture all names, especially public speakers and promotions mentioned near the end.

  DSv4 also flagged these task-specific quality concerns
  (kept here for reference, not enforced by the judge):
    - P1_incomplete_read: Agent stops reading before reaching the end of the transcript, missing later sections with public speakers or promotions.
    - P2_missing_sections: Report lacks one or more of the required five sections (Council Members, City Staff, Presenters and Experts, Community Members / Public Speakers, Other People Mentioned).
    - P3_role_errors: Individuals are listed without correct titles/affiliations (e.g., Shelby without Attorney, Bercaw without Chief, Hamilton without Raftelis).
    - P4_insufficient_public_speakers: Fewer than 12 public speakers are identified from the transcript.
    - P5_no_context: Report lists names without any brief context or description of their role in the meeting.
