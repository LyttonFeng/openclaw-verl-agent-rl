task_id: task_meeting_gov_recommendations
goal: Extract all recommendations from the NASA UAP hearing transcript, categorize them, attribute them to speakers, and write a structured summary to recommendations.md.
inputs:
  - transcript.md
output: recommendations.md
milestones:
  - id: M1_transcript_loaded
    desc: The agent has read the full transcript.md file into its context.
    signals:
      - Agent tool call to read('transcript.md') or read('transcript.md', offset=...) returns content
      - Agent text mentions reading or parsing the transcript
  - id: M2_recommendations_identified
    desc: The agent has identified at least 12 distinct recommendations from the transcript content.
    signals:
      - Agent text lists or enumerates multiple recommendations from the transcript
      - Agent text references specific speaker names (e.g., Kirkpatrick, Bianco, Spergel) in the context of recommendations
  - id: M3_categories_defined
    desc: The agent has defined the category groups (e.g., Data Collection, Data Standards, Sensor Technology) for organizing the recommendations.
    signals:
      - Agent text mentions or lists category names like "Data Collection" or "Partnerships"
      - Agent text describes grouping recommendations by category
  - id: M4_recommendations_written
    desc: The agent has written the recommendations.md file with recommendations grouped by category and attributed to speakers.
    signals:
      - Agent tool call to write('recommendations.md', content) or similar file write
      - Agent text confirms file creation or shows file content with categories and speaker attributions
  - id: M5_summary_included
    desc: The agent has included a concluding summary of the most emphasized or repeated recommendations in the output file.
    signals:
      - Output file content contains a section titled "Summary" or "Key Themes" or similar
      - Agent text mentions synthesizing or summarizing the most common recommendations
pitfalls:
  - id: P1_incomplete_read
    desc: The agent stops reading the transcript before reaching the end, missing recommendations from later sections.
    severity: high
  - id: P2_no_categorization
    desc: The agent outputs a flat list of recommendations without grouping them into the required categories.
    severity: high
  - id: P3_missing_attribution
    desc: The agent fails to attribute recommendations to specific speakers or attributes them incorrectly.
    severity: high
  - id: P4_implicit_recommendations_missed
    desc: The agent only extracts explicitly framed recommendations (e.g., "I recommend...") and misses implicit ones (e.g., "We need to...").
    severity: medium
  - id: P5_no_summary
    desc: The agent completes the file without including a summary of the most emphasized themes.
    severity: medium
notes: The transcript is long (~120k chars) so the agent may need multiple read calls. The agent must distinguish between observations and actionable recommendations.