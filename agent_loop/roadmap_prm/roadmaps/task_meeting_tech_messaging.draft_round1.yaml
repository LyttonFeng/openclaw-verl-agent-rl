task_id: task_meeting_tech_messaging
goal: Extract and organize all messaging framework options, evaluation criteria, final selections, and rejected alternatives from the meeting transcript into a structured markdown file.
inputs:
  - meeting_transcript.md
output: messaging_framework.md
milestones:
  - id: M1_transcript_parsed
    desc: The agent has read the meeting transcript and located the messaging exercise section.
    signals:
      - tool call to read('meeting_transcript.md') or similar
      - agent text references the messaging exercise or tagline discussion
  - id: M2_pillars_identified
    desc: The three messaging pillars (Transparency/Single Platform, End-to-end Control, Speed/Security) are identified and named.
    signals:
      - output mentions "Transparency" or "Single Platform" or "All-in-one"
      - output mentions "End-to-end control" or "Software factory"
      - output mentions "Speed" or "Security" or "Risk"
  - id: M3_candidates_listed
    desc: Multiple candidate taglines/phrases are listed for each pillar, including originals and alternatives.
    signals:
      - output contains "A single source of truth, countless possibilities"
      - output contains "All-in-one for everyone"
      - output contains "End to end control over your software factory"
      - output contains "More speed less risk"
      - output contains "Move fast with confidence"
      - output contains "Scale up, speed up, test up"
      - output contains "No trade-offs"
      - output contains "Velocity with confidence"
  - id: M4_evaluation_criteria_captured
    desc: The evaluation criteria (parity of tone, catchiness, technical accuracy, parallel construction) are documented.
    signals:
      - output contains "parity" or "tone" or "noun phrase" or "verb phrase"
      - output contains "catchy" or "pithy"
      - output contains "technical accuracy" or "absolute claims" or "engineer mindset"
      - output contains "parallel construction" or "With GitLab you get"
  - id: M5_finals_and_rejected_separated
    desc: Final selections are clearly distinguished from rejected alternatives, with reasons for rejection.
    signals:
      - output contains "Final" or "Selected" or "Chosen" section heading
      - output contains "Rejected" or "Discarded" or "Alternatives" section heading
      - output explains why "test up" was rejected
      - output explains why "no trade-offs" was rejected
  - id: M6_security_subtagline_captured
    desc: The security sub-tagline "Secure the factory and its deliverables" is captured with attribution.
    signals:
      - output contains "Secure the factory and its deliverables"
      - output contains "Cindy" or "blog post"
  - id: M7_file_written
    desc: The output file messaging_framework.md is created with all extracted content.
    signals:
      - tool call to write('messaging_framework.md', ...)
      - file messaging_framework.md exists in workspace
pitfalls:
  - id: P1_missing_pillar
    desc: Agent fails to identify one of the three messaging pillars, resulting in incomplete extraction.
    severity: high
  - id: P2_no_rejection_reasoning
    desc: Agent lists rejected alternatives without explaining why they were rejected (e.g., "test up" sounds goofy, "no trade-offs" contradicts engineering mindset).
    severity: medium
  - id: P3_finals_ambiguous
    desc: Agent does not clearly separate final selections from alternatives, making it hard to identify what was chosen.
    severity: high
  - id: P4_missing_attribution
    desc: Agent fails to attribute ideas to speakers (e.g., William, Cindy) or misses the Ash Withers inspiration and Cindy blog post credit.
    severity: low
  - id: P5_incomplete_candidates
    desc: Agent captures only the final selections and misses many proposed alternatives (e.g., "Velocity with confidence", "No trade-offs", "All-in-one for everyone").
    severity: medium
notes: The expert trajectory completed the task in 3 turns. The key is to parse the transcript thoroughly, identify all three pillars, list all candidate phrases per pillar, capture evaluation criteria and rejection reasons, and clearly separate finals from alternatives with attribution.