task_id: task_meeting_gov_data_sources

goal: |
  Extract all data sources, sensors, databases, and measurement systems from the NASA UAP hearing transcript into a structured, categorized markdown report.

inputs:
  - transcript.md

output: data_sources.md

# ROUND 3 (auto-promoted from R1 draft):
#   - DSv4-flash drafted task-specific milestones (kept).
#   - Added PRECONDITION to write milestone.
#   - Appended generic M_close_cleanly.
#   - Replaced pitfalls with the 5 canonical turn-level pitfalls
#     validated on pilot A (blog_post) + pilot B (council_budget).
#   - DSv4's task-specific pitfalls preserved as informational notes.

milestones:
  - id: M1_transcript_read
    desc: |
      The agent reads the full transcript file to identify all data source references.
    signals:
      - "read('transcript.md') or read('transcript.md', offset=...) is called"
      - "The agent's text mentions reading or parsing the transcript"

  - id: M2_government_military_sources
    desc: |
      Government and military data sources (AARO, DOD sensors, IC sensors) are identified and documented.
    signals:
      - AARO database mentioned with case count details
      - DOD sensors (F-35, MQ-9) or IC sensors referenced
      - Purpose-built AARO sensors mentioned

  - id: M3_civilian_aviation_sources
    desc: |
      Civilian aviation systems (FAA radars, ADS-B, TRACON, ERAM/STARS, Domestic Events Network) are identified.
    signals:
      - FAA short-range radar (ASR, 40-60 mile range) mentioned
      - FAA long-range radar (ARSR-4, CRSR, 200-250 nm) mentioned
      - ADS-B or Automatic Dependent Surveillance-Broadcast mentioned

  - id: M4_space_based_and_scientific_sources
    desc: |
      Space-based assets (NASA/NOAA satellites, JWST, Hubble, ISS) and ground-based scientific instruments are identified.
    signals:
      - NASA earth science/sensing satellites or NOAA satellites mentioned
      - James Webb Space Telescope or Hubble Space Telescope mentioned
      - Radio telescopes, astronomical observatories, or NOAA ground sensors mentioned

  - id: M5_crowdsource_and_database_sources
    desc: |
      Crowdsource/public data sources and databases/archives are identified.
    signals:
      - Smartphone sensor data or iPhone imagery mentioned
      - Eyewitness reports or proposed NASA crowdsourcing platform mentioned
      - NASA open data portal (data.nasa.gov) or Data.gov mentioned

  - id: M6_report_written
    desc: |
      The agent writes the final data_sources.md file with categories, summary table, and limitations.
    signals:
      - "write('data_sources.md', content=...) is called"
      - Content includes a summary table or overview section
      - Content includes at least 3 limitation notes for different sources
      - "PRECONDITION: a prior turn in this trajectory has performed a successful read of transcript.md (returned substantial content without is_error). If no such prior read exists, this milestone does NOT fire (the turn is P2_write_without_reading instead)."

  - id: M_close_cleanly
    desc: |
      The final turn of the trajectory, after the write milestone has fired,
      produces a brief confirmation or empty text and no further write that
      would replace the main output.
    signals:
      - this is the last turn of the trajectory
      - the write milestone has already fired in a prior turn
      - this turn has no tool call OR a non-write tool call
      - if there is any text, it is < 400 chars

pitfalls:
  - id: P1_no_output_written
    desc: |
      This is the LAST turn of the trajectory AND no `write` to the expected
      output file has occurred in any turn so far. The agent ran out of budget
      without producing the required output. (4B's dominant failure mode.)
    severity: high

  - id: P2_write_without_reading
    desc: |
      LITERAL CHECK ONLY. This turn issues a `write` tool_call to the expected
      output file AND no prior turn in this trajectory contains a `read`
      tool_call whose tool_result returned `is_error: false` with content
      length > 1000 chars on the input file. Do NOT infer hallucination from
      content style or formatting — only check whether a successful prior read
      tool_call exists in the trajectory history. If one does exist, this
      pitfall does NOT fire even if the written content is long and polished.
    severity: high

  - id: P3_post_write_rambling
    desc: |
      LITERAL CHECK ONLY. A prior turn already produced a `write` tool_call to
      the expected output file. THIS turn produces an assistant text block
      (`type: text`, OUTSIDE any tool_call) longer than 500 chars. Length
      check only — do NOT judge whether the trailing text "looks like" a
      paraphrase or restatement. If the trailing text is < 500 chars, this
      pitfall does NOT fire.
    severity: high

  - id: P4_excessive_thinking_no_action
    desc: |
      This turn's thinking is > 2500 chars AND no tool call is issued AND no
      substantive text (> 200 chars) is produced. Burning budget on thinking
      without any progress. (Note: thinking PAIRED with a meaningful tool call
      in the same turn is NOT a pitfall — Qwen3 requires thinking.)
    severity: high

  - id: P5_read_loop
    desc: |
      This turn issues a `read` of the input file with arguments identical to
      a previous read in the trajectory, AND no `write`, no extraction-thinking
      that names new content, and no extraction-text has occurred between the
      two reads. The agent is stuck re-reading the same chunk.
    severity: medium

notes: |
  The transcript is a long meeting with multiple speakers; the agent must read all sections to catch sources mentioned in passing. The expert trajectory used 9 turns with multiple read calls to cover the full file.

  DSv4 also flagged these task-specific quality concerns
  (kept here for reference, not enforced by the judge):
    - P1_incomplete_read: Agent fails to read the full transcript, missing key data sources mentioned in later sections.
    - P2_no_categorization: Agent lists sources without organizing them into the required categories (Government/Military, Civilian Aviation, etc.).
    - P3_missing_limitations: Agent describes sources but fails to note limitations (e.g., DOD sensors not scientific, FAA filtering, iPhone photos unhelpful).
    - P4_no_summary_table: Agent writes detailed entries but omits the required summary table at the top.
    - P5_technical_inaccuracy: Agent includes incorrect technical details (e.g., wrong radar range, misattributed owner) or conflates different systems.
