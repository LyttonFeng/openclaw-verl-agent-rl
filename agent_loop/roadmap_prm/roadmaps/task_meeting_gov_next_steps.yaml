task_id: task_meeting_gov_next_steps

goal: |
  Extract all mentioned next steps, follow-up actions, timelines, and deliverables from the NASA UAP hearing transcript into a well-organized file.

inputs:
  - transcript.md

output: next_steps.md

# ROUND 3 (auto-promoted from R1 draft):
#   - DSv4-flash drafted task-specific milestones (kept).
#   - Added PRECONDITION to write milestone.
#   - Appended generic M_close_cleanly.
#   - Replaced pitfalls with the 5 canonical turn-level pitfalls
#     validated on pilot A (blog_post) + pilot B (council_budget).
#   - DSv4's task-specific pitfalls preserved as informational notes.

milestones:
  - id: M1_read_transcript
    desc: |
      The agent reads the full transcript file.
    signals:
      - "tool call to read('transcript.md') or read('path') where path contains 'transcript'"
      - agent text mentions reading or parsing the transcript

  - id: M2_identify_immediate_actions
    desc: |
      The agent identifies next steps with timelines in weeks (panel deliberations, AARO annual report, Five Eyes agreements).
    signals:
      - "mentions 'panel continues deliberations' or 'several months'"
      - "mentions 'AARO annual report' and 'August 1'"
      - "mentions 'Five Eyes' or 'data-sharing agreements'"

  - id: M3_identify_near_term_actions
    desc: |
      The agent identifies actions with timelines in months (final report, sensor findings, embed, Q&A publication).
    signals:
      - "mentions 'final report' and 'summer' or 'end of July'"
      - "mentions 'purpose-built sensors' or 'sensor anomaly'"
      - "mentions 'NASA embed' or 'Pritar'"
      - "mentions 'Q&A' and 'science.nasa.gov'"

  - id: M4_identify_long_term_goals
    desc: |
      The agent identifies ongoing or long-term actions (monitoring campaigns, sensor calibration, AI/ML analytics, partnerships, crowdsourcing, budget).
    signals:
      - "mentions '24/7 collection monitoring' or 'hotspot areas'"
      - "mentions 'calibrating DOD sensors' or 'F-35' and 'weather balloons'"
      - "mentions 'AI/ML analytics'"
      - "mentions 'international scientific partnerships'"
      - "mentions 'citizen science' or 'crowdsourcing platform'"
      - "mentions 'budget allocation' or 'program funding'"

  - id: M5_identify_open_questions
    desc: |
      The agent identifies unresolved issues or debates from the meeting.
    signals:
      - "mentions 'open question' or 'unresolved' or 'debate'"
      - "mentions 'scope' and 'aerial' or 'underwater' or 'space'"
      - "mentions 'definition of anomalous'"
      - "mentions 'FAA raw radar data' or 'technical challenge'"
      - "mentions 'formal UAP program' or 'too early to say'"

  - id: M6_organize_and_write_output
    desc: |
      The agent writes the organized next steps document with sections and timeline visualization.
    signals:
      - "tool call to write('next_steps.md', ...) or write('action_items.md', ...)"
      - "output file contains sections like 'Immediate', 'Near-Term', 'Longer-Term', 'Open Questions'"
      - output file contains a timeline visualization or milestone summary
      - "PRECONDITION: a prior turn in this trajectory has performed a successful read of transcript.md (returned substantial content without is_error). If no such prior read exists, this milestone does NOT fire (the turn is P2_write_without_reading instead)."

  - id: M_close_cleanly
    desc: |
      The final turn of the trajectory, after the write milestone has fired,
      produces a brief confirmation or empty text and no further write that
      would replace the main output.
    signals:
      - this is the last turn of the trajectory
      - the write milestone has already fired in a prior turn
      - this turn has no tool call OR a non-write tool call
      - if there is any text, it is < 400 chars

pitfalls:
  - id: P1_no_output_written
    desc: |
      This is the LAST turn of the trajectory AND no `write` to the expected
      output file has occurred in any turn so far. The agent ran out of budget
      without producing the required output. (4B's dominant failure mode.)
    severity: high

  - id: P2_write_without_reading
    desc: |
      LITERAL CHECK ONLY. This turn issues a `write` tool_call to the expected
      output file AND no prior turn in this trajectory contains a `read`
      tool_call whose tool_result returned `is_error: false` with content
      length > 1000 chars on the input file. Do NOT infer hallucination from
      content style or formatting — only check whether a successful prior read
      tool_call exists in the trajectory history. If one does exist, this
      pitfall does NOT fire even if the written content is long and polished.
    severity: high

  - id: P3_post_write_rambling
    desc: |
      LITERAL CHECK ONLY. A prior turn already produced a `write` tool_call to
      the expected output file. THIS turn produces an assistant text block
      (`type: text`, OUTSIDE any tool_call) longer than 500 chars. Length
      check only — do NOT judge whether the trailing text "looks like" a
      paraphrase or restatement. If the trailing text is < 500 chars, this
      pitfall does NOT fire.
    severity: high

  - id: P4_excessive_thinking_no_action
    desc: |
      This turn's thinking is > 2500 chars AND no tool call is issued AND no
      substantive text (> 200 chars) is produced. Burning budget on thinking
      without any progress. (Note: thinking PAIRED with a meaningful tool call
      in the same turn is NOT a pitfall — Qwen3 requires thinking.)
    severity: high

  - id: P5_read_loop
    desc: |
      This turn issues a `read` of the input file with arguments identical to
      a previous read in the trajectory, AND no `write`, no extraction-thinking
      that names new content, and no extraction-text has occurred between the
      two reads. The agent is stuck re-reading the same chunk.
    severity: medium

notes: |
  The transcript contains many forward-looking statements. The agent must distinguish between committed actions, planned activities, and aspirational goals. The final output should be a practical reference document.

  DSv4 also flagged these task-specific quality concerns
  (kept here for reference, not enforced by the judge):
    - P1_incomplete_read: Agent stops reading the transcript before reaching the end, missing later discussion items.
    - P2_missing_open_questions: Agent fails to identify any open questions or unresolved issues from the meeting.
    - P3_no_timeline_distinction: Agent lists action items without distinguishing between firm deadlines, vague timing, and ongoing efforts.
    - P4_no_organization: Agent outputs a flat list of items without organizing by timeframe or including a timeline visualization.
    - P5_missing_responsible_parties: Agent fails to attribute actions to specific responsible parties (NASA, AARO, panel, FAA, etc.).
