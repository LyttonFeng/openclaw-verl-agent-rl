task_id: task_meeting_searchable_index

goal: |
  Create a structured, searchable index file (meeting_index.md) from a meeting transcript that includes metadata, topic index, people index, keyword index, decisions log, and action items log.

inputs:
  - meeting_transcript.md

output: meeting_index.md

# ROUND 3 (auto-promoted from R1 draft):
#   - DSv4-flash drafted task-specific milestones (kept).
#   - Added PRECONDITION to write milestone.
#   - Appended generic M_close_cleanly.
#   - Replaced pitfalls with the 5 canonical turn-level pitfalls
#     validated on pilot A (blog_post) + pilot B (council_budget).
#   - DSv4's task-specific pitfalls preserved as informational notes.

milestones:
  - id: M1_read_transcript
    desc: |
      The agent reads the full meeting transcript file to understand its content.
    signals:
      - "Tool call to read('meeting_transcript.md') or equivalent"
      - Agent text references reading the file

  - id: M2_metadata_extracted
    desc: |
      The agent identifies and records the meeting title, date, and participant names.
    signals:
      - "Output contains \"GitLab Product Marketing Meeting\" or similar title"
      - "Output contains \"2021-06-28\" or \"June 28, 2021\""
      - Output lists at least three participant names (e.g., William, Cindy, Cormac)

  - id: M3_topic_index_created
    desc: |
      The agent creates a numbered list of at least five distinct topics discussed, each with a one-sentence description.
    signals:
      - "A section titled \"Topic Index\" or \"Topics\" with numbered items"
      - At least five distinct topic entries, each with a descriptive sentence
      - Topics include event sponsorship, Commit conference, competitive infographic, messaging framework, or similar

  - id: M4_people_index_created
    desc: |
      The agent creates a section listing at least three people and what they contributed or were assigned.
    signals:
      - "A section titled \"People Index\" or \"People\""
      - At least three named individuals with descriptions of their contributions
      - "{'Entries like \"William': 'led meeting, proposed messaging taglines\"'}"

  - id: M5_keyword_index_created
    desc: |
      The agent creates an alphabetical list of at least ten key terms with brief context notes.
    signals:
      - "A section titled \"Keyword Index\" or \"Keywords\""
      - At least ten entries, alphabetically ordered
      - Entries include terms like KubeCon, Commit, Azure DevOps, vulnerability management

  - id: M6_decisions_and_actions_logged
    desc: |
      The agent creates a numbered decisions log (at least 3) and an action items log (at least 2) with owners and deadlines.
    signals:
      - "A section titled \"Decisions Log\" or \"Decisions\" with numbered items"
      - "A section titled \"Action Items\" or \"Actions\" with owners and deadlines"
      - At least three decision entries and two action item entries

  - id: M7_file_written
    desc: |
      The agent writes the complete index to meeting_index.md.
    signals:
      - "Tool call to write('meeting_index.md', ...)"
      - Final text confirms the file is written
      - "PRECONDITION: a prior turn in this trajectory has performed a successful read of meeting_transcript.md (returned substantial content without is_error). If no such prior read exists, this milestone does NOT fire (the turn is P2_write_without_reading instead)."

  - id: M_close_cleanly
    desc: |
      The final turn of the trajectory, after the write milestone has fired,
      produces a brief confirmation or empty text and no further write that
      would replace the main output.
    signals:
      - this is the last turn of the trajectory
      - the write milestone has already fired in a prior turn
      - this turn has no tool call OR a non-write tool call
      - if there is any text, it is < 400 chars

pitfalls:
  - id: P1_no_output_written
    desc: |
      This is the LAST turn of the trajectory AND no `write` to the expected
      output file has occurred in any turn so far. The agent ran out of budget
      without producing the required output. (4B's dominant failure mode.)
    severity: high

  - id: P2_write_without_reading
    desc: |
      LITERAL CHECK ONLY. This turn issues a `write` tool_call to the expected
      output file AND no prior turn in this trajectory contains a `read`
      tool_call whose tool_result returned `is_error: false` with content
      length > 1000 chars on the input file. Do NOT infer hallucination from
      content style or formatting — only check whether a successful prior read
      tool_call exists in the trajectory history. If one does exist, this
      pitfall does NOT fire even if the written content is long and polished.
    severity: high

  - id: P3_post_write_rambling
    desc: |
      LITERAL CHECK ONLY. A prior turn already produced a `write` tool_call to
      the expected output file. THIS turn produces an assistant text block
      (`type: text`, OUTSIDE any tool_call) longer than 500 chars. Length
      check only — do NOT judge whether the trailing text "looks like" a
      paraphrase or restatement. If the trailing text is < 500 chars, this
      pitfall does NOT fire.
    severity: high

  - id: P4_excessive_thinking_no_action
    desc: |
      This turn's thinking is > 2500 chars AND no tool call is issued AND no
      substantive text (> 200 chars) is produced. Burning budget on thinking
      without any progress. (Note: thinking PAIRED with a meaningful tool call
      in the same turn is NOT a pitfall — Qwen3 requires thinking.)
    severity: high

  - id: P5_read_loop
    desc: |
      This turn issues a `read` of the input file with arguments identical to
      a previous read in the trajectory, AND no `write`, no extraction-thinking
      that names new content, and no extraction-text has occurred between the
      two reads. The agent is stuck re-reading the same chunk.
    severity: medium

notes: |
  The roadmap milestones are designed to be sequential but not strictly ordered; the agent may interleave creation of sections. The key is that all sections are present and meet minimum counts.

  DSv4 also flagged these task-specific quality concerns
  (kept here for reference, not enforced by the judge):
    - P1_skipped_transcript: The agent attempts to write the index without first reading the transcript file.
    - P2_incomplete_sections: The agent omits one or more required sections (metadata, topic index, people index, keyword index, decisions log, action items log).
    - P3_too_few_entries: The agent creates sections but with fewer than the required number of entries (e.g., less than 5 topics, less than 10 keywords).
    - P4_no_alphabetization: The keyword index is not alphabetized or clearly organized, reducing searchability.
    - P5_verbose_or_vague_entries: Index entries are either too verbose (full paragraphs) or too vague (just terms with no context), failing the index quality criterion.
