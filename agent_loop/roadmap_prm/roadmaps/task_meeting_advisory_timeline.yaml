task_id: task_meeting_advisory_timeline

goal: |
  Extract all temporal references from the meeting transcript and organize them into a structured, chronologically ordered timeline report.

inputs:
  - meeting-transcript.md

output: timeline.md

# ROUND 3 (auto-promoted from R1 draft):
#   - DSv4-flash drafted task-specific milestones (kept).
#   - Added PRECONDITION to write milestone.
#   - Appended generic M_close_cleanly.
#   - Replaced pitfalls with the 5 canonical turn-level pitfalls
#     validated on pilot A (blog_post) + pilot B (council_budget).
#   - DSv4's task-specific pitfalls preserved as informational notes.

milestones:
  - id: M1_read_transcript
    desc: |
      The agent reads the meeting transcript file to access the source material.
    signals:
      - "tool call to read('meeting-transcript.md')"
      - "tool call to read('meeting-transcript.txt')"
      - "tool call to read('meeting-transcript')"

  - id: M2_identify_historical_references
    desc: |
      The agent identifies and extracts past events, dates, and timeframes mentioned in the transcript (e.g., 2010 memo, Oct 2011 report, prior relocations).
    signals:
      - "text containing \"June 2010\" or \"President's memorandum\" or \"500 MHz goal\""
      - "text containing \"October 1, 2011\" or \"infamous October 1st\""
      - "text containing \"1710-1755\" and \"cleared in 5 years\""
      - "text containing \"2001\" and \"cost estimates\""

  - id: M3_identify_future_deadlines
    desc: |
      The agent extracts all future deadlines, target dates, and scheduled meetings mentioned in the transcript.
    signals:
      - "text containing \"September 2012\" and \"weather satellite\" or \"Working Group 1\""
      - "text containing \"January 2013\" and \"Working Group\" or \"wrap up\""
      - "text containing \"July 24\" and \"Boulder\" or \"next meeting\""
      - "text containing \"ISART\" and \"July 25\" or \"July 26\""
      - "text containing \"10-year\" and \"transition\" or \"relocation\""
      - "text containing \"5-year\" and \"law enforcement\" or \"first phase\""

  - id: M4_organize_chronologically
    desc: |
      The agent structures all extracted entries into a chronological timeline, distinguishing past, present, and future events.
    signals:
      - "report contains a section titled \"Chronological Timeline\" or \"Timeline\""
      - entries are ordered by date or timeframe (e.g., 2010, 2011, 2012, 2013)
      - report uses clear formatting like tables, lists, or headings to separate time periods

  - id: M5_write_timeline_report
    desc: |
      The agent writes the final structured timeline report to the output file.
    signals:
      - "tool call to write('timeline.md', ...)"
      - "tool call to write('timeline_report.md', ...)"
      - "tool call to write('deadlines.md', ...)"
      - "PRECONDITION: a prior turn in this trajectory has performed a successful read of meeting-transcript.md (returned substantial content without is_error). If no such prior read exists, this milestone does NOT fire (the turn is P2_write_without_reading instead)."

  - id: M_close_cleanly
    desc: |
      The final turn of the trajectory, after the write milestone has fired,
      produces a brief confirmation or empty text and no further write that
      would replace the main output.
    signals:
      - this is the last turn of the trajectory
      - the write milestone has already fired in a prior turn
      - this turn has no tool call OR a non-write tool call
      - if there is any text, it is < 400 chars

pitfalls:
  - id: P1_no_output_written
    desc: |
      This is the LAST turn of the trajectory AND no `write` to the expected
      output file has occurred in any turn so far. The agent ran out of budget
      without producing the required output. (4B's dominant failure mode.)
    severity: high

  - id: P2_write_without_reading
    desc: |
      LITERAL CHECK ONLY. This turn issues a `write` tool_call to the expected
      output file AND no prior turn in this trajectory contains a `read`
      tool_call whose tool_result returned `is_error: false` with content
      length > 1000 chars on the input file. Do NOT infer hallucination from
      content style or formatting — only check whether a successful prior read
      tool_call exists in the trajectory history. If one does exist, this
      pitfall does NOT fire even if the written content is long and polished.
    severity: high

  - id: P3_post_write_rambling
    desc: |
      LITERAL CHECK ONLY. A prior turn already produced a `write` tool_call to
      the expected output file. THIS turn produces an assistant text block
      (`type: text`, OUTSIDE any tool_call) longer than 500 chars. Length
      check only — do NOT judge whether the trailing text "looks like" a
      paraphrase or restatement. If the trailing text is < 500 chars, this
      pitfall does NOT fire.
    severity: high

  - id: P4_excessive_thinking_no_action
    desc: |
      This turn's thinking is > 2500 chars AND no tool call is issued AND no
      substantive text (> 200 chars) is produced. Burning budget on thinking
      without any progress. (Note: thinking PAIRED with a meaningful tool call
      in the same turn is NOT a pitfall — Qwen3 requires thinking.)
    severity: high

  - id: P5_read_loop
    desc: |
      This turn issues a `read` of the input file with arguments identical to
      a previous read in the trajectory, AND no `write`, no extraction-thinking
      that names new content, and no extraction-text has occurred between the
      two reads. The agent is stuck re-reading the same chunk.
    severity: medium

notes: |
  The transcript contains both exact dates (e.g., July 24, 2012) and relative timeframes (e.g., "within the next week", "two and a half years ago"). The agent should resolve relative references to approximate dates where possible.

  DSv4 also flagged these task-specific quality concerns
  (kept here for reference, not enforced by the judge):
    - P1_missing_historical_context: The agent focuses only on future deadlines and ignores important historical references that provide context.
    - P2_fabricated_or_inaccurate_dates: The agent invents dates or timeframes not present in the transcript, or misattributes dates to the wrong events.
    - P3_no_attribution_or_context: The agent lists dates without indicating who mentioned them or what conditions apply, making the timeline less useful.
    - P4_poor_organization: The agent dumps all dates in a random order without chronological or logical grouping, making the report hard to scan.
    - P5_incomplete_extraction: The agent misses key deadlines like the September 2012 target, January 2013 target, or the ISART meeting.
