task_id: task_meeting_advisory_technical

goal: |
  Extract all technical discussions from the CSMAC meeting transcript into a structured report covering frequency bands, federal systems, technical challenges, proposed solutions, working group assignments, and the commercial deployment parameters debate.

inputs:
  - meeting-transcript.md

output: technical_discussions.md

# ROUND 3 (auto-promoted from R1 draft):
#   - DSv4-flash drafted task-specific milestones (kept).
#   - Added PRECONDITION to write milestone.
#   - Appended generic M_close_cleanly.
#   - Replaced pitfalls with the 5 canonical turn-level pitfalls
#     validated on pilot A (blog_post) + pilot B (council_budget).
#   - DSv4's task-specific pitfalls preserved as informational notes.

milestones:
  - id: M1_read_transcript
    desc: |
      The agent reads the meeting transcript file to understand the content.
    signals:
      - "tool call to read('meeting-transcript.md') or equivalent"
      - tool result contains text from the transcript

  - id: M2_identify_working_groups
    desc: |
      The agent identifies and lists the five proposed working groups with their scope and co-chair assignments.
    signals:
      - "text mentions \"Working Group 1\" through \"Working Group 5\""
      - text includes co-chair names (e.g., Yvonne Navarro, John Hunter) or NTIA reps (e.g., Ed Drocella, Rich Orsulak)
      - text describes scope of each working group

  - id: M3_extract_technical_topics
    desc: |
      The agent extracts at least four of the key technical topics (weather satellites, law enforcement, satellite uplinks, electronic warfare, tactical radio relay, airborne operations) with frequency bands and technical challenges.
    signals:
      - "text includes \"1695-1710 MHz\" or \"weather satellite\" with \"exclusion area\""
      - "text includes \"law enforcement\" with \"wideband\" or \"three-step transition\""
      - "text includes \"satellite uplink\" or \"satellite control\" with \"interference into industry\""
      - "text includes \"electronic warfare\" with \"training\" or \"cell phone\""
      - "text includes \"airborne operations\" with \"UAV\" or \"precision-guided munitions\""
      - "text includes \"tactical radio relay\" or \"fixed microwave\""

  - id: M4_capture_parameters_debate
    desc: |
      The agent captures the commercial deployment parameters debate about LTE standards, macrocells vs small cells, and power levels.
    signals:
      - "text mentions \"LTE\" or \"Long Term Evolution\" in context of parameters"
      - "text mentions \"macrocell\" or \"small cell\" in context of deployment"
      - "text mentions \"power levels\" or \"uniform parameters\""
      - text references Rush, Warren, Kahn, or Calabrese in context of parameters

  - id: M5_write_report
    desc: |
      The agent writes the structured report to the output file.
    signals:
      - "tool call to write('technical_discussions.md', ...) or equivalent"
      - tool result confirms file was written
      - "PRECONDITION: a prior turn in this trajectory has performed a successful read of meeting-transcript.md (returned substantial content without is_error). If no such prior read exists, this milestone does NOT fire (the turn is P2_write_without_reading instead)."

  - id: M_close_cleanly
    desc: |
      The final turn of the trajectory, after the write milestone has fired,
      produces a brief confirmation or empty text and no further write that
      would replace the main output.
    signals:
      - this is the last turn of the trajectory
      - the write milestone has already fired in a prior turn
      - this turn has no tool call OR a non-write tool call
      - if there is any text, it is < 400 chars

pitfalls:
  - id: P1_no_output_written
    desc: |
      This is the LAST turn of the trajectory AND no `write` to the expected
      output file has occurred in any turn so far. The agent ran out of budget
      without producing the required output. (4B's dominant failure mode.)
    severity: high

  - id: P2_write_without_reading
    desc: |
      LITERAL CHECK ONLY. This turn issues a `write` tool_call to the expected
      output file AND no prior turn in this trajectory contains a `read`
      tool_call whose tool_result returned `is_error: false` with content
      length > 1000 chars on the input file. Do NOT infer hallucination from
      content style or formatting — only check whether a successful prior read
      tool_call exists in the trajectory history. If one does exist, this
      pitfall does NOT fire even if the written content is long and polished.
    severity: high

  - id: P3_post_write_rambling
    desc: |
      LITERAL CHECK ONLY. A prior turn already produced a `write` tool_call to
      the expected output file. THIS turn produces an assistant text block
      (`type: text`, OUTSIDE any tool_call) longer than 500 chars. Length
      check only — do NOT judge whether the trailing text "looks like" a
      paraphrase or restatement. If the trailing text is < 500 chars, this
      pitfall does NOT fire.
    severity: high

  - id: P4_excessive_thinking_no_action
    desc: |
      This turn's thinking is > 2500 chars AND no tool call is issued AND no
      substantive text (> 200 chars) is produced. Burning budget on thinking
      without any progress. (Note: thinking PAIRED with a meaningful tool call
      in the same turn is NOT a pitfall — Qwen3 requires thinking.)
    severity: high

  - id: P5_read_loop
    desc: |
      This turn issues a `read` of the input file with arguments identical to
      a previous read in the trajectory, AND no `write`, no extraction-thinking
      that names new content, and no extraction-text has occurred between the
      two reads. The agent is stuck re-reading the same chunk.
    severity: medium

notes: |
  The roadmap focuses on the key extraction steps and common failure modes for this technical analysis task. The agent must separate technical substance from policy discussion.

  DSv4 also flagged these task-specific quality concerns
  (kept here for reference, not enforced by the judge):
    - P1_missed_working_groups: The agent fails to identify or describe all five working groups, omitting their scope or co-chair assignments.
    - P2_incorrect_interference_direction: The agent mischaracterizes the direction of interference for satellite uplinks (e.g., saying industry interferes with satellites instead of satellites interfering with industry).
    - P3_omitted_parameters_debate: The agent fails to capture the commercial deployment parameters debate, missing the discussion about LTE standards, macrocells, small cells, and power levels.
    - P4_missing_sta_measurement: The agent does not mention the T-Mobile/CTIA STA measurement request or special temporary authorization for airborne operations.
    - P5_vague_technical_details: The agent extracts topics but provides vague or incomplete technical details (e.g., missing frequency bands, system descriptions, or specific MHz ranges).
