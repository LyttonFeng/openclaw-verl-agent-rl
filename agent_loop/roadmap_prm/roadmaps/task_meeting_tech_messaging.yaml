task_id: task_meeting_tech_messaging

goal: |
  Extract and organize all messaging framework options, evaluation criteria, final selections, and rejected alternatives from the meeting transcript into a structured markdown file.

inputs:
  - meeting_transcript.md

output: messaging_framework.md

# ROUND 3 (auto-promoted from R1 draft):
#   - DSv4-flash drafted task-specific milestones (kept).
#   - Added PRECONDITION to write milestone.
#   - Appended generic M_close_cleanly.
#   - Replaced pitfalls with the 5 canonical turn-level pitfalls
#     validated on pilot A (blog_post) + pilot B (council_budget).
#   - DSv4's task-specific pitfalls preserved as informational notes.

milestones:
  - id: M1_transcript_parsed
    desc: |
      The agent has read the meeting transcript and located the messaging exercise section.
    signals:
      - "tool call to read('meeting_transcript.md') or similar"
      - agent text references the messaging exercise or tagline discussion

  - id: M2_pillars_identified
    desc: |
      The three messaging pillars (Transparency/Single Platform, End-to-end Control, Speed/Security) are identified and named.
    signals:
      - "output mentions \"Transparency\" or \"Single Platform\" or \"All-in-one\""
      - "output mentions \"End-to-end control\" or \"Software factory\""
      - "output mentions \"Speed\" or \"Security\" or \"Risk\""

  - id: M3_candidates_listed
    desc: |
      Multiple candidate taglines/phrases are listed for each pillar, including originals and alternatives.
    signals:
      - "output contains \"A single source of truth, countless possibilities\""
      - "output contains \"All-in-one for everyone\""
      - "output contains \"End to end control over your software factory\""
      - "output contains \"More speed less risk\""
      - "output contains \"Move fast with confidence\""
      - "output contains \"Scale up, speed up, test up\""
      - "output contains \"No trade-offs\""
      - "output contains \"Velocity with confidence\""

  - id: M4_evaluation_criteria_captured
    desc: |
      The evaluation criteria (parity of tone, catchiness, technical accuracy, parallel construction) are documented.
    signals:
      - "output contains \"parity\" or \"tone\" or \"noun phrase\" or \"verb phrase\""
      - "output contains \"catchy\" or \"pithy\""
      - "output contains \"technical accuracy\" or \"absolute claims\" or \"engineer mindset\""
      - "output contains \"parallel construction\" or \"With GitLab you get\""

  - id: M5_finals_and_rejected_separated
    desc: |
      Final selections are clearly distinguished from rejected alternatives, with reasons for rejection.
    signals:
      - "output contains \"Final\" or \"Selected\" or \"Chosen\" section heading"
      - "output contains \"Rejected\" or \"Discarded\" or \"Alternatives\" section heading"
      - "output explains why \"test up\" was rejected"
      - "output explains why \"no trade-offs\" was rejected"

  - id: M6_security_subtagline_captured
    desc: |
      The security sub-tagline "Secure the factory and its deliverables" is captured with attribution.
    signals:
      - "output contains \"Secure the factory and its deliverables\""
      - "output contains \"Cindy\" or \"blog post\""

  - id: M7_file_written
    desc: |
      The output file messaging_framework.md is created with all extracted content.
    signals:
      - "tool call to write('messaging_framework.md', ...)"
      - file messaging_framework.md exists in workspace
      - "PRECONDITION: a prior turn in this trajectory has performed a successful read of meeting_transcript.md (returned substantial content without is_error). If no such prior read exists, this milestone does NOT fire (the turn is P2_write_without_reading instead)."

  - id: M_close_cleanly
    desc: |
      The final turn of the trajectory, after the write milestone has fired,
      produces a brief confirmation or empty text and no further write that
      would replace the main output.
    signals:
      - this is the last turn of the trajectory
      - the write milestone has already fired in a prior turn
      - this turn has no tool call OR a non-write tool call
      - if there is any text, it is < 400 chars

pitfalls:
  - id: P1_no_output_written
    desc: |
      This is the LAST turn of the trajectory AND no `write` to the expected
      output file has occurred in any turn so far. The agent ran out of budget
      without producing the required output. (4B's dominant failure mode.)
    severity: high

  - id: P2_write_without_reading
    desc: |
      LITERAL CHECK ONLY. This turn issues a `write` tool_call to the expected
      output file AND no prior turn in this trajectory contains a `read`
      tool_call whose tool_result returned `is_error: false` with content
      length > 1000 chars on the input file. Do NOT infer hallucination from
      content style or formatting — only check whether a successful prior read
      tool_call exists in the trajectory history. If one does exist, this
      pitfall does NOT fire even if the written content is long and polished.
    severity: high

  - id: P3_post_write_rambling
    desc: |
      LITERAL CHECK ONLY. A prior turn already produced a `write` tool_call to
      the expected output file. THIS turn produces an assistant text block
      (`type: text`, OUTSIDE any tool_call) longer than 500 chars. Length
      check only — do NOT judge whether the trailing text "looks like" a
      paraphrase or restatement. If the trailing text is < 500 chars, this
      pitfall does NOT fire.
    severity: high

  - id: P4_excessive_thinking_no_action
    desc: |
      This turn's thinking is > 2500 chars AND no tool call is issued AND no
      substantive text (> 200 chars) is produced. Burning budget on thinking
      without any progress. (Note: thinking PAIRED with a meaningful tool call
      in the same turn is NOT a pitfall — Qwen3 requires thinking.)
    severity: high

  - id: P5_read_loop
    desc: |
      This turn issues a `read` of the input file with arguments identical to
      a previous read in the trajectory, AND no `write`, no extraction-thinking
      that names new content, and no extraction-text has occurred between the
      two reads. The agent is stuck re-reading the same chunk.
    severity: medium

notes: |
  The expert trajectory completed the task in 3 turns. The key is to parse the transcript thoroughly, identify all three pillars, list all candidate phrases per pillar, capture evaluation criteria and rejection reasons, and clearly separate finals from alternatives with attribution.

  DSv4 also flagged these task-specific quality concerns
  (kept here for reference, not enforced by the judge):
    - P1_missing_pillar: Agent fails to identify one of the three messaging pillars, resulting in incomplete extraction.
    - P2_no_rejection_reasoning: Agent lists rejected alternatives without explaining why they were rejected (e.g., "test up" sounds goofy, "no trade-offs" contradicts engineering mindset).
    - P3_finals_ambiguous: Agent does not clearly separate final selections from alternatives, making it hard to identify what was chosen.
    - P4_missing_attribution: Agent fails to attribute ideas to speakers (e.g., William, Cindy) or misses the Ash Withers inspiration and Cindy blog post credit.
    - P5_incomplete_candidates: Agent captures only the final selections and misses many proposed alternatives (e.g., "Velocity with confidence", "No trade-offs", "All-in-one for everyone").
