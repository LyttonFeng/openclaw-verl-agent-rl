task_id: task_meeting_tech_decisions

goal: |
  Extract all decisions and consensus points from the meeting transcript and write them to a structured file.

inputs:
  - meeting_transcript.md

output: decisions.md

# ROUND 3 (auto-promoted from R1 draft):
#   - DSv4-flash drafted task-specific milestones (kept).
#   - Added PRECONDITION to write milestone.
#   - Appended generic M_close_cleanly.
#   - Replaced pitfalls with the 5 canonical turn-level pitfalls
#     validated on pilot A (blog_post) + pilot B (council_budget).
#   - DSv4's task-specific pitfalls preserved as informational notes.

milestones:
  - id: M1_read_transcript
    desc: |
      The agent reads the meeting transcript file.
    signals:
      - "Tool call to read('meeting_transcript.md') or similar"
      - Agent text references reading the file

  - id: M2_identify_decisions
    desc: |
      The agent identifies at least 5 distinct decisions from the transcript.
    signals:
      - Agent text lists or enumerates multiple decisions
      - Agent mentions specific decisions like event assignments, tagline, or competitive methodology

  - id: M3_write_decisions_file
    desc: |
      The agent writes the decisions to the output file.
    signals:
      - "Tool call to write('decisions.md', ...) or similar"
      - Agent text confirms file written
      - "PRECONDITION: a prior turn in this trajectory has performed a successful read of meeting_transcript.md (returned substantial content without is_error). If no such prior read exists, this milestone does NOT fire (the turn is P2_write_without_reading instead)."

  - id: M4_include_summary
    desc: |
      The output file includes a summary at the top with total number of decisions and which need follow-up.
    signals:
      - File content starts with a summary section
      - Summary mentions total count and follow-up status

  - id: M5_include_context_and_status
    desc: |
      Each decision includes context and status (final, tentative, needs follow-up).
    signals:
      - "Each decision entry has a 'Context' or 'Background' field"
      - "Each decision entry has a 'Status' field with values like final, tentative, or needs follow-up"

  - id: M_close_cleanly
    desc: |
      The final turn of the trajectory, after the write milestone has fired,
      produces a brief confirmation or empty text and no further write that
      would replace the main output.
    signals:
      - this is the last turn of the trajectory
      - the write milestone has already fired in a prior turn
      - this turn has no tool call OR a non-write tool call
      - if there is any text, it is < 400 chars

pitfalls:
  - id: P1_no_output_written
    desc: |
      This is the LAST turn of the trajectory AND no `write` to the expected
      output file has occurred in any turn so far. The agent ran out of budget
      without producing the required output. (4B's dominant failure mode.)
    severity: high

  - id: P2_write_without_reading
    desc: |
      LITERAL CHECK ONLY. This turn issues a `write` tool_call to the expected
      output file AND no prior turn in this trajectory contains a `read`
      tool_call whose tool_result returned `is_error: false` with content
      length > 1000 chars on the input file. Do NOT infer hallucination from
      content style or formatting — only check whether a successful prior read
      tool_call exists in the trajectory history. If one does exist, this
      pitfall does NOT fire even if the written content is long and polished.
    severity: high

  - id: P3_post_write_rambling
    desc: |
      LITERAL CHECK ONLY. A prior turn already produced a `write` tool_call to
      the expected output file. THIS turn produces an assistant text block
      (`type: text`, OUTSIDE any tool_call) longer than 500 chars. Length
      check only — do NOT judge whether the trailing text "looks like" a
      paraphrase or restatement. If the trailing text is < 500 chars, this
      pitfall does NOT fire.
    severity: high

  - id: P4_excessive_thinking_no_action
    desc: |
      This turn's thinking is > 2500 chars AND no tool call is issued AND no
      substantive text (> 200 chars) is produced. Burning budget on thinking
      without any progress. (Note: thinking PAIRED with a meaningful tool call
      in the same turn is NOT a pitfall — Qwen3 requires thinking.)
    severity: high

  - id: P5_read_loop
    desc: |
      This turn issues a `read` of the input file with arguments identical to
      a previous read in the trajectory, AND no `write`, no extraction-thinking
      that names new content, and no extraction-text has occurred between the
      two reads. The agent is stuck re-reading the same chunk.
    severity: medium

notes: |
  The transcript contains 7 key decisions; the agent should capture at least 5.

  DSv4 also flagged these task-specific quality concerns
  (kept here for reference, not enforced by the judge):
    - P1_skip_reading: The agent writes the output file without first reading the transcript.
    - P2_miss_key_decisions: The agent fails to capture major decisions like event assignments, tagline, or competitive methodology.
    - P3_conflate_discussion: The agent includes items that were discussed but not decided as decisions.
    - P4_no_context: The agent lists decisions without any context or background.
    - P5_no_status: The agent omits status indicators for decisions.
