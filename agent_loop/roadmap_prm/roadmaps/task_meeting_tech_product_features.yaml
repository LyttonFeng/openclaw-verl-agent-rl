task_id: task_meeting_tech_product_features

goal: |
  Create a prioritized list of product features from a meeting transcript, including top 5 picks, methodology, and deprioritized items.

inputs:
  - meeting_transcript.md

output: feature_priorities.md

# ROUND 3 (auto-promoted from R1 draft):
#   - DSv4-flash drafted task-specific milestones (kept).
#   - Added PRECONDITION to write milestone.
#   - Appended generic M_close_cleanly.
#   - Replaced pitfalls with the 5 canonical turn-level pitfalls
#     validated on pilot A (blog_post) + pilot B (council_budget).
#   - DSv4's task-specific pitfalls preserved as informational notes.

milestones:
  - id: M1_transcript_parsed
    desc: |
      The agent has read the meeting transcript and identified all feature discussions.
    signals:
      - "read('meeting_transcript.md') or equivalent file read tool call"
      - agent output references specific features from the transcript (e.g., UX, vulnerability management, GitOps)

  - id: M2_features_cataloged
    desc: |
      At least 8 distinct features or feature bundles are listed with name, stage, excitement level, description, and notes.
    signals:
      - file write contains 8 or more distinct feature entries
      - each entry has a name, stage, excitement level (1-3), description, and notes section

  - id: M3_top5_identified
    desc: |
      The top 5 overall picks for the Commit keynote are explicitly listed, including UX, vulnerability management, GitOps, pipeline editor, and a Plan item.
    signals:
      - "section titled \"Top 5\" or \"Top 5 Overall Picks\" present"
      - UX improvements listed as a top pick
      - Vulnerability management listed as a top pick
      - GitOps/Kubernetes agent listed as a top pick
      - Pipeline editor mentioned for CI/CD

  - id: M4_methodology_documented
    desc: |
      The methodology for evaluating features is documented, including bundling MVCs, excitement levels as stack rank, and targeting top 5 for PR.
    signals:
      - section or paragraph describing methodology present
      - "keywords: \"bundle\", \"MVC\", \"excitement level\", \"stack rank\", \"top 5\""
      - mentions reusing GitLab 14.0 announcements

  - id: M5_deprioritized_noted
    desc: |
      Features explicitly deprioritized are listed with reasons, such as fuzzing due to prior press coverage.
    signals:
      - section or entry for deprioritized features
      - fuzzing mentioned as deprioritized due to prior press coverage
      - reason for deprioritization stated

  - id: M_close_cleanly
    desc: |
      The final turn of the trajectory, after the write milestone has fired,
      produces a brief confirmation or empty text and no further write that
      would replace the main output.
    signals:
      - this is the last turn of the trajectory
      - the write milestone has already fired in a prior turn
      - this turn has no tool call OR a non-write tool call
      - if there is any text, it is < 400 chars

pitfalls:
  - id: P1_no_output_written
    desc: |
      This is the LAST turn of the trajectory AND no `write` to the expected
      output file has occurred in any turn so far. The agent ran out of budget
      without producing the required output. (4B's dominant failure mode.)
    severity: high

  - id: P2_write_without_reading
    desc: |
      LITERAL CHECK ONLY. This turn issues a `write` tool_call to the expected
      output file AND no prior turn in this trajectory contains a `read`
      tool_call whose tool_result returned `is_error: false` with content
      length > 1000 chars on the input file. Do NOT infer hallucination from
      content style or formatting — only check whether a successful prior read
      tool_call exists in the trajectory history. If one does exist, this
      pitfall does NOT fire even if the written content is long and polished.
    severity: high

  - id: P3_post_write_rambling
    desc: |
      LITERAL CHECK ONLY. A prior turn already produced a `write` tool_call to
      the expected output file. THIS turn produces an assistant text block
      (`type: text`, OUTSIDE any tool_call) longer than 500 chars. Length
      check only — do NOT judge whether the trailing text "looks like" a
      paraphrase or restatement. If the trailing text is < 500 chars, this
      pitfall does NOT fire.
    severity: high

  - id: P4_excessive_thinking_no_action
    desc: |
      This turn's thinking is > 2500 chars AND no tool call is issued AND no
      substantive text (> 200 chars) is produced. Burning budget on thinking
      without any progress. (Note: thinking PAIRED with a meaningful tool call
      in the same turn is NOT a pitfall — Qwen3 requires thinking.)
    severity: high

  - id: P5_read_loop
    desc: |
      This turn issues a `read` of the input file with arguments identical to
      a previous read in the trajectory, AND no `write`, no extraction-thinking
      that names new content, and no extraction-text has occurred between the
      two reads. The agent is stuck re-reading the same chunk.
    severity: medium

notes: |
  The roadmap focuses on extracting structured data from the transcript and organizing it into a prioritized list with methodology. The expert trajectory completed in 3 turns with a single read and write.

  DSv4 also flagged these task-specific quality concerns
  (kept here for reference, not enforced by the judge):
    - P1_missing_features: Agent lists fewer than 8 features or misses major features like UX, vulnerability management, GitOps, or pipeline editor.
    - P2_no_top5_section: Agent fails to include a dedicated top 5 picks section or omits key top picks (UX, vulnerability management, GitOps).
    - P3_no_methodology: Agent does not document the bundling methodology, excitement level stack ranking, or the top 5 targeting approach.
    - P4_ignores_deprioritized: Agent fails to mention fuzzing as deprioritized or does not explain why it was deprioritized.
    - P5_inaccurate_stages: Agent assigns incorrect stages to features (e.g., UX to Create only, or GitOps to CI/CD).
