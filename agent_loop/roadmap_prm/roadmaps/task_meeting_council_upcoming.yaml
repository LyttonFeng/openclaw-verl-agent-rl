task_id: task_meeting_council_upcoming

goal: |
  Extract all upcoming events, deadlines, and future dates from the Tampa City Council transcript into a chronologically ordered markdown report with a highlights section.

inputs:
  - transcript.md

output: upcoming_events.md

# ROUND 3 (auto-promoted from R1 draft):
#   - DSv4-flash drafted task-specific milestones (kept).
#   - Added PRECONDITION to write milestone.
#   - Appended generic M_close_cleanly.
#   - Replaced pitfalls with the 5 canonical turn-level pitfalls
#     validated on pilot A (blog_post) + pilot B (council_budget).
#   - DSv4's task-specific pitfalls preserved as informational notes.

milestones:
  - id: M1_transcript_read
    desc: |
      The full transcript has been read and is available for analysis.
    signals:
      - Agent has called read() on transcript.md
      - "Agent's context contains text from the transcript file"

  - id: M2_events_extracted
    desc: |
      Key upcoming events and deadlines have been identified from the transcript content.
    signals:
      - Agent mentions or lists specific dates like April 16, April 20, May 7, May 15, August 3/10/17, March 2027, September 2028
      - Agent references specific events like Veterans Committee, East Tampa Town Hall, ethics report, Fire Station 24 GMP, budget workshops, capacity fees, Rome Yard

  - id: M3_report_drafted
    desc: |
      A draft of the upcoming_events.md file has been written to the workspace.
    signals:
      - Agent calls write() with a path ending in upcoming_events.md
      - The written content includes a chronological list of events with dates
      - "PRECONDITION: a prior turn in this trajectory has performed a successful read of transcript.md (returned substantial content without is_error). If no such prior read exists, this milestone does NOT fire (the turn is P2_write_without_reading instead)."

  - id: M4_highlights_added
    desc: |
      The report includes a "What to watch" or equivalent highlights section.
    signals:
      - "The written content contains a section header like \"What to watch\", \"Highlights\", \"Key items\", or similar"
      - The highlights section summarizes the most important upcoming events

  - id: M5_report_complete
    desc: |
      The final report is complete and the agent confirms the task is done.
    signals:
      - "Agent's final turn text confirms the report is written and summarizes its contents"
      - No further tool calls are made after the write

  - id: M_close_cleanly
    desc: |
      The final turn of the trajectory, after the write milestone has fired,
      produces a brief confirmation or empty text and no further write that
      would replace the main output.
    signals:
      - this is the last turn of the trajectory
      - the write milestone has already fired in a prior turn
      - this turn has no tool call OR a non-write tool call
      - if there is any text, it is < 400 chars

pitfalls:
  - id: P1_no_output_written
    desc: |
      This is the LAST turn of the trajectory AND no `write` to the expected
      output file has occurred in any turn so far. The agent ran out of budget
      without producing the required output. (4B's dominant failure mode.)
    severity: high

  - id: P2_write_without_reading
    desc: |
      LITERAL CHECK ONLY. This turn issues a `write` tool_call to the expected
      output file AND no prior turn in this trajectory contains a `read`
      tool_call whose tool_result returned `is_error: false` with content
      length > 1000 chars on the input file. Do NOT infer hallucination from
      content style or formatting — only check whether a successful prior read
      tool_call exists in the trajectory history. If one does exist, this
      pitfall does NOT fire even if the written content is long and polished.
    severity: high

  - id: P3_post_write_rambling
    desc: |
      LITERAL CHECK ONLY. A prior turn already produced a `write` tool_call to
      the expected output file. THIS turn produces an assistant text block
      (`type: text`, OUTSIDE any tool_call) longer than 500 chars. Length
      check only — do NOT judge whether the trailing text "looks like" a
      paraphrase or restatement. If the trailing text is < 500 chars, this
      pitfall does NOT fire.
    severity: high

  - id: P4_excessive_thinking_no_action
    desc: |
      This turn's thinking is > 2500 chars AND no tool call is issued AND no
      substantive text (> 200 chars) is produced. Burning budget on thinking
      without any progress. (Note: thinking PAIRED with a meaningful tool call
      in the same turn is NOT a pitfall — Qwen3 requires thinking.)
    severity: high

  - id: P5_read_loop
    desc: |
      This turn issues a `read` of the input file with arguments identical to
      a previous read in the trajectory, AND no `write`, no extraction-thinking
      that names new content, and no extraction-text has occurred between the
      two reads. The agent is stuck re-reading the same chunk.
    severity: medium

notes: |
  The transcript is large and may require multiple read() calls to capture fully. The automated checks are strict about file name and content patterns.

  DSv4 also flagged these task-specific quality concerns
  (kept here for reference, not enforced by the judge):
    - P1_incomplete_read: Agent fails to read the entire transcript, missing events from later portions.
    - P2_wrong_output_file: Agent writes the report to a file name other than upcoming_events.md.
    - P3_missing_highlights: Agent produces a list of events but omits the required "What to watch" highlights section.
    - P4_non_chronological: Agent lists events in the order they appear in the transcript rather than chronologically by date.
    - P5_incorrect_dates: Agent misattributes dates to events or includes events that are not actually upcoming.
