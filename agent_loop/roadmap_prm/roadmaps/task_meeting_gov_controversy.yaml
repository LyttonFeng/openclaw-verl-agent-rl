task_id: task_meeting_gov_controversy

goal: |
  Identify and analyze controversial, surprising, or debate-generating statements from a NASA UAP hearing transcript, including multi-perspective interpretations and tone/framing analysis, in a file called controversy_analysis.md.

inputs:
  - transcript.md

output: controversy_analysis.md

# ROUND 3 (auto-promoted from R1 draft):
#   - DSv4-flash drafted task-specific milestones (kept).
#   - Added PRECONDITION to write milestone.
#   - Appended generic M_close_cleanly.
#   - Replaced pitfalls with the 5 canonical turn-level pitfalls
#     validated on pilot A (blog_post) + pilot B (council_budget).
#   - DSv4's task-specific pitfalls preserved as informational notes.

milestones:
  - id: M1_read_transcript
    desc: |
      The agent reads the full transcript file to understand the content.
    signals:
      - Agent calls read on transcript.md
      - Agent acknowledges reading the transcript content

  - id: M2_identify_harassment
    desc: |
      The agent identifies the panelist harassment statements as a notable/controversial element.
    signals:
      - "Output mentions \"harassment\" or \"online abuse\" or \"threats\" related to panelists"
      - References Dan Evans or Nicola Fox discussing harassment

  - id: M3_identify_core_controversies
    desc: |
      The agent identifies at least 5 of the key controversial statements (e.g., 2-5% anomalous, no ET evidence, classified data tension, DOD sensors not scientific, debunked case, FAA report rate, budget question).
    signals:
      - "Mentions \"2-5%\" or \"single-digit percent\" anomalous"
      - "Mentions \"no conclusive evidence of extraterrestrial origin\" or similar"
      - Mentions classified data limitations or the fighter jet/Statue of Liberty analogy
      - Mentions DOD sensors not being scientific or designed for weapons
      - Mentions a resolved/debunked case (e.g., commercial aircraft, going into water)

  - id: M4_analyze_audience_perspectives
    desc: |
      The agent analyzes how different audiences (scientists, public, media, UFO community) would interpret the identified statements.
    signals:
      - "Output contains sections or phrases referencing \"scientists\", \"public\", \"media\", \"UFO community\", or \"skeptics\""
      - At least three distinct audience perspectives are discussed

  - id: M5_provide_context_and_nuance
    desc: |
      The agent provides surrounding context and notes diplomatic tensions or unstated implications for the identified statements.
    signals:
      - "Output includes \"context\" sections or paragraphs explaining surrounding discussion"
      - Notes tensions or disagreements between speakers
      - Mentions unstated implications (e.g., no formal NASA UAP program)

  - id: M6_analyze_tone_and_framing
    desc: |
      The agent includes a section analyzing the overall tone and framing choices of the panel.
    signals:
      - "Output contains a section titled \"Tone\" or \"Framing\" or \"Overall tone\""
      - Discusses what the panel emphasized or avoided
      - Mentions balance between skepticism and openness, or destigmatization

  - id: M7_write_output_file
    desc: |
      The agent writes the complete analysis to the output file controversy_analysis.md.
    signals:
      - "Agent calls write with path containing \"controversy_analysis.md\""
      - Output file exists in the workspace
      - "PRECONDITION: a prior turn in this trajectory has performed a successful read of transcript.md (returned substantial content without is_error). If no such prior read exists, this milestone does NOT fire (the turn is P2_write_without_reading instead)."

  - id: M_close_cleanly
    desc: |
      The final turn of the trajectory, after the write milestone has fired,
      produces a brief confirmation or empty text and no further write that
      would replace the main output.
    signals:
      - this is the last turn of the trajectory
      - the write milestone has already fired in a prior turn
      - this turn has no tool call OR a non-write tool call
      - if there is any text, it is < 400 chars

pitfalls:
  - id: P1_no_output_written
    desc: |
      This is the LAST turn of the trajectory AND no `write` to the expected
      output file has occurred in any turn so far. The agent ran out of budget
      without producing the required output. (4B's dominant failure mode.)
    severity: high

  - id: P2_write_without_reading
    desc: |
      LITERAL CHECK ONLY. This turn issues a `write` tool_call to the expected
      output file AND no prior turn in this trajectory contains a `read`
      tool_call whose tool_result returned `is_error: false` with content
      length > 1000 chars on the input file. Do NOT infer hallucination from
      content style or formatting — only check whether a successful prior read
      tool_call exists in the trajectory history. If one does exist, this
      pitfall does NOT fire even if the written content is long and polished.
    severity: high

  - id: P3_post_write_rambling
    desc: |
      LITERAL CHECK ONLY. A prior turn already produced a `write` tool_call to
      the expected output file. THIS turn produces an assistant text block
      (`type: text`, OUTSIDE any tool_call) longer than 500 chars. Length
      check only — do NOT judge whether the trailing text "looks like" a
      paraphrase or restatement. If the trailing text is < 500 chars, this
      pitfall does NOT fire.
    severity: high

  - id: P4_excessive_thinking_no_action
    desc: |
      This turn's thinking is > 2500 chars AND no tool call is issued AND no
      substantive text (> 200 chars) is produced. Burning budget on thinking
      without any progress. (Note: thinking PAIRED with a meaningful tool call
      in the same turn is NOT a pitfall — Qwen3 requires thinking.)
    severity: high

  - id: P5_read_loop
    desc: |
      This turn issues a `read` of the input file with arguments identical to
      a previous read in the trajectory, AND no `write`, no extraction-thinking
      that names new content, and no extraction-text has occurred between the
      two reads. The agent is stuck re-reading the same chunk.
    severity: medium

notes: |
  The task requires higher-order analysis of social and political dynamics around UAP discourse, not just information extraction. The agent must read the full transcript (it is long, may require multiple reads) before writing.

  DSv4 also flagged these task-specific quality concerns
  (kept here for reference, not enforced by the judge):
    - P1_skips_transcript_reading: The agent attempts to write the analysis without fully reading the transcript, missing key details.
    - P2_superficial_list_only: The agent only lists controversial statements without providing analysis, context, or audience perspectives.
    - P3_misses_harassment_element: The agent fails to identify the panelist harassment discussion as a notable controversial element.
    - P4_no_multi_perspective_analysis: The agent analyzes statements from only one viewpoint (e.g., only scientific) without considering public, media, or UFO community interpretations.
    - P5_ignores_tone_and_framing: The agent does not include any analysis of the panel's overall tone, framing choices, or what was deliberately avoided.
    - P6_writes_to_wrong_filename: The agent writes the analysis to a file with a different name than controversy_analysis.md, causing automated checks to fail.
