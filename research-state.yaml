project: committee-reward-agentic-rl
question: >
  Can a stable, heterogeneous LLM "committee" reward (RULER-style relative scoring)
  train qwen3.5-4b to beat its own base on agentic meeting-analysis tasks (Val3:
  advisory / gov / tech), where the automated rule-based grader is a weak, gameable
  proxy? Specifically: what AUTO_W blend weight is right, and does judge deliberation help?

status: outer-loop-synthesized (full @0.3 ablation complete; not yet concluded — clean-w5 + push-advisory open)
created: 2026-06-15

evaluation:
  protocol: temp=0.3 RUNS=3 per model; committee judge = 3 heterogeneous judges
    (ds-v4-flash / qwen3-max / MiniMax-M3) x 2-order consistency x deliberation;
    3 base runs x 3 lora runs = 9 genuine cross pairs; sign-test on non-tie pairs.
  canonical_base: base@0.3 (MEETING 79.5%; advisory 0.93 / gov 0.738 / tech 0.716).
    Anchored so every lora is judged vs the SAME base (cross-eval nondeterminism is a real confound).
  primary_metric: committee verdict (win/tie/loss per task) vs base. automated is secondary (gameable).

hypotheses:
  H1_auto_w_low:
    statement: Lower AUTO_W (committee-dominant) beats higher AUTO_W, because automated
      rewards verbosity/coverage and committee rewards grounding/quality; they conflict at the top.
    status: supported (w2=0.5 beat w3=0.7 in prior temp=0 runs; re-testing @0.3)
  H2_deliberation:
    statement: Judge deliberation (round-2 on disagreement) improves the reward signal,
      especially recovering advisory completeness.
    status: testing (w6 = deliberation; first @0.3 result = gov sig-win, advisory 6:2 favored)

variants:  # committee verdict (adv/gov/tech) vs base@0.3 + automated MEETING%
  base:  {auto_w: n/a, note: canonical anchor, meeting_pct: 79.5}
  w5:    {auto_w: 0.0, delib: false, committee: "adv tie / gov WIN 8:1 p.039 / tech tie", meeting_pct: 67.9, note: "advisory flake run"}
  w6:    {auto_w: 0.0, delib: true,  committee: "adv 6:2 lora / gov WIN 7:1 p.070 / tech tie", meeting_pct: 79.7, note: "BEST balanced; tech accuracy preserved"}
  w4:    {auto_w: 0.2, delib: false, committee: "adv tie / gov WIN 7:1 p.070 / tech tie", meeting_pct: 79.3}
  w2:    {auto_w: 0.5, delib: false, committee: "adv tie / gov TIE 4:4 / tech tie", meeting_pct: 81.3, note: "PARADOX: highest automated, weakest committee"}
  w3:    {auto_w: 0.7, delib: false, committee: "adv 6:2 lora / gov WIN 9:0 p.004 / tech tie", meeting_pct: 74.7}
  w7:    {auto_w: 0.0, delib: true, init: committee_w6, data: "fresh on-policy CLEAN (temp0.7, filenames fixed, 7/9 groups)", lr: 2.0e-5,
          committee: "adv tie 5:4 / gov WIN 8:0 p.008 / tech tie 5:3-lora", meeting_pct: 82.9,
          note: "first clean post-harness-fix round; CONSOLIDATED gov (stronger than w6); highest automated; advisory/tech ceiling unmoved"}

conclusions:  # CORRECTED after w5 clean rerun (the flake had biased the deliberation claim)
  - "ROBUST: committee-reward beats base on gov, INVISIBLE to automated (gov auto/hyb flat ~.85/.74=base). But only LARGE margins trustworthy: same w5 adapter gave gov 8:1 p.039 then 6:1 p.125 across reruns; only w3 9:0 p.004 is solid."
  - "w2 paradox (robust): highest automated (81.3%) = weakest committee (gov tie). Chasing automated is counterproductive."
  - "AUTO_W (H1) NOT the lever — gov favored across 0.0-0.7."
  - "Deliberation (H2) RETRACTED: w5-clean ≈ w6 (advisory 5:4 vs 6:2 both tie; tech auto identical; the 'w5 attribution 0.17 crash' was the flake). No robust effect; keep only as cheap/harmless."
  - "advisory & tech = GENUINE ties (human can spot obvious diffs but not adjudicate these). Do not chase marginal 6:2."
  - "No single 'best' config: w5-clean/w4/w6 ≈ equivalent. Next-round init choice not load-bearing."

  - "mem0 (training-free hint injection) base+mem0 beats base on all 3 dims (gov WIN 7:1; advisory/tech 7:2 lean); HEAD-TO-HEAD w7+mem0 ≈ base+mem0 (all tie) → memory subsumes RL on this task family; mem0 moves advisory/tech that RL could not (flat gradient). Red line held."
  - "mem0-RL round 1 (w8-mem0): hint-augmented ROLLOUTS do NOT restore advisory gradient. K=8 firm triplet: advisory 1 completer/4 timeouts (untrainable), gov std 0.095 (6 comp), tech std 0.160 (7 comp). advisory untrainability is TWO-fold: low variance when complete + the advisory TRAINING instance is a long-doc timeout case (1/8 completion). advisory EVAL instance IS completable (mem0 wins it) → RL never sees clean advisory rollouts, inference does. Hints fix neither (no shorter doc, no added variance). → mem0 is an inference-time lever; on-policy RL can't distill it here. Retraining w8-mem0 on 7 healthy groups (drop nasa) to answer sub-q (b): does training on hint-rollouts distill hint-following into weights (eval WITHOUT hints)?"
  - "DISTILLATION TEST (w8-mem0 trained on healthy hint-rollouts, eval'd WITHOUT hints vs base@0.3): advisory TIE 5:4 (p=1.0), gov lora>base SIG 8:1 (p=0.039), tech TIE 5:3:1 (p=0.727). automated 82.5% ≈ w7. → training on hint-rollouts distills NOTHING beyond w7: advisory/tech (dims mem0 helps) stay at base; only gov (dim RL trains) holds. mem0's advisory/tech benefit is STRICTLY inference-time; on-policy RL can't bake it in (hints compress variance + advisory training instance uncompleteable). BOTH user sub-questions = clean NO."
  - "BREAKTHROUGH (2026-06-17): RL ON the mem0 harness CAN beat base+mem — gated recipe wins tech. Cold-start from BASE (gradient unsaturated per H-A: base+mem gov/tech var ~0.13 vs w7's saturated 0.06) + POLICY-GATED memory (hints optional, policy learns WHEN to use). gated-RL vs base+mem (committee): advisory TIE 4:4, gov TIE 2:3:4, TECH lora>base 7:1 (p=0.070). hybrid 78.7 vs 80.0 (win invisible to automated, same blindness pattern). forced-RL (forced framing, MORE variance 0.133) vs base+mem: ALL TIE → the lever is GATING (learn when to use memory), NOT raw gradient. gated≥forced on all 3 dims head-to-head (tech 6:3, not sig). RECIPE for RL-on-mem0: base init + policy-gated memory + drop uncompleteable groups."
  - "gated ON-POLICY r1→r2→r3 vs base+mem: tech lora-favored ALL 3 rounds (7:1 p.070 / 8:1 p.039 / 5:3 tie) — direction robust, magnitude sample-noisy (sig 2/3, iteration does NOT monotonically grow it). gov oscillates tie/LOSS-7:1/tie (r2 'regression' was NOISE, recovered r3 — no tech-for-gov tradeoff). advisory tie throughout. BEST checkpoint = gated_r1 (sig tech + no gov regress + cleanest). One good cold-start round captures the gain; more rounds don't amplify. advisory too timeout-fragile for on-policy (4/4 all-timeout from trained model → dropped r2/r3). For robust magnitude: bigger eval N or 4th held-out judge, not more training."

current_focus: >
  GOAL (user, 2026-06-17, restated + "小心行事"): CONSTRUCTIVE — find HOW to do RL ON TOP OF the
  mem0 harness so the model actually IMPROVES over base+mem0. Not "prove RL useless"; negatives only
  rule out dead paths. Be deliberate: never touch running pod jobs, verify before each GPU action,
  don't burn compute on experiments that don't serve "improve the model", confirm before any big
  training round. RECIPE HYPOTHESIS (3 prerequisites, RL fails if any missing — w8-mem0 failed on #3):
  (1) GRADIENT EXISTS: init from base+mem0 (trainable dims NOT yet saturated, unlike w7) + push
      sampling temp to fight hint variance-compression. [testing: base+mem variance temp0.7/1.0]
  (2) mem0 LEAVES HEADROOM: train on COMPLETABLE + INSTANCE-SPECIFIC tasks where a generic hint can't
      carry the answer (implicit owners/retractions/revised deadlines) but a correctness reward can. [H-E #32]
  (3) NOT POISONED: strict healthcheck (drop timeout/no-write groups) + reward only what the hint can't
      encode. (w8-mem0 regressed advisory by continue-training on timeout-heavy advisory hint-rollouts.)
  Gate: if base+mem has gradient -> proceed to H-E carefully; if even temp1.0 base+mem is flat -> STOP,
  confirm direction with user before any large training. ORIGINAL BROADEN framing below still applies.
  BROADEN (2026-06-17, user-directed): actively HUNT the regime where RL beats the mem0 harness
  baseline ("寻找 RL 的空间 —— mem 带不了它"). mem0 IS a permanent harness component (hints at BOTH
  train and eval); the question is RL-on-mem0-harness vs base+mem0, NOT distillation-into-weights.
  Principle — RL's space = (1) gradient exists (within-group reward variance high enough), (2) generic
  hint underperforms (correct behavior is INSTANCE-SPECIFIC, not a one-line how-to), (3) base reachable
  (not context-wall). Data points to TECH (variance 0.160 highest; only unique RL+mem win 9:0); advisory
  hopeless (0.055 + uncompleteable training instance); gov redundant (both win). On CURRENT Val3 tasks
  head-to-head w7+mem0 vs base+mem0 is all-tie → RL hasn't escaped yet → likely need task DESIGN.
  Plan: (step1, queued bh9tjq9ey) base+mem rollout variance vs w7+mem — does gradient return from base
  init? (step2, H-E) build a COMPLETABLE-but-instance-specific hard set (implicit owners / retractions /
  revised deadlines / multi-statement synthesis) where a generic hint provably can't carry the answer,
  train RL from base+mem, judge head-to-head vs base+mem. Predict RL > base+mem there.

